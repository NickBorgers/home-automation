---
# Minimal lighting config for testing
# This config mirrors production hue_config.yaml structure for accurate testing
rooms:
  - hue_group: Living Room
    hass_area_id: living_room
    conditions:
      # Priority 1: No one home and awake -> OFF
      - action: off
        variable: isAnyoneHomeAndAwake
        value: false
      # Priority 2: Someone home and awake -> ON
      - action: on
        variable: isAnyoneHomeAndAwake
        value: true
      # Priority 3: TV not playing -> ON
      - action: on
        variable: isTVPlaying
        value: false
    increase_brightness_if_true: isHaveGuests
    transition_seconds: 5
  - hue_group: Master Bedroom
    hass_area_id: master_bedroom
    conditions:
      # CRITICAL: isWakeSequenceActive MUST be checked BEFORE isAnyoneHomeAndAwake!
      #
      # BUG FIX (2026-01-13 production incident):
      # During wake sequence, isMasterAsleep=true so isAnyoneHomeAndAwake=false.
      # If isAnyoneHomeAndAwake is checked first, the lighting plugin turns off
      # the bedroom lights immediately after sleephygiene turns them on,
      # causing wake cancellation.
      #
      # Priority 1: Wake sequence in progress -> yield to sleephygiene
      # This takes absolute priority to prevent race condition with wake sequence
      - action: on
        variable: isWakeSequenceActive
        value: true
      # Priority 2: No one home and awake -> OFF
      - action: off
        variable: isAnyoneHomeAndAwake
        value: false
      # Priority 3: Master asleep -> OFF
      - action: off
        variable: isMasterAsleep
        value: true
      # Priority 4: Master not asleep -> ON
      - action: on
        variable: isMasterAsleep
        value: false
    increase_brightness_if_true: ~
    transition_seconds: 5
  - hue_group: Front of House
    hass_area_id: front_of_house
    conditions:
      # Priority 1: Person detected -> ON (security override)
      - action: on
        variable: isFrontOfHousePersonPresent
        value: true
      # Priority 2: No one home -> OFF
      - action: off
        variable: isAnyoneHome
        value: false
      # Priority 3: Someone home -> ON
      - action: on
        variable: isAnyoneHome
        value: true
    increase_brightness_if_true: ~
    transition_seconds: 5
