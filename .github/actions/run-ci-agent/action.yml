---
name: Run CI agent
description: >
  Runs an AI agent (via `.devcontainer/run-ai.sh`) inside the dedicated CI
  container image (`.github/ci/Dockerfile` → `ghcr.io/nickborgers/home-automation-ci:latest`),
  bypassing `@devcontainers/cli` / `devcontainers/ci@v0.3` entirely. The CI
  image is built and pushed by `.github/workflows/ci-image.yml`.
  This is the replacement for the legacy devcontainers/ci-based invocation
  pattern.

inputs:
  image:
    description: CI image tag. Defaults to ghcr.io/nickborgers/home-automation-ci:latest.
    required: false
    default: ghcr.io/nickborgers/home-automation-ci:latest
  prompt_file:
    description: >
      Path (relative to workspace) to the envsubst-templated prompt file. The
      file's ${VAR} references are expanded from the environment variables
      passed via `env` before being handed to `.devcontainer/run-ai.sh`.
    required: true
  output_file:
    description: >
      Absolute path inside the container (also mounted back to the runner) to
      capture the agent's stdout stream. Parent directory is created
      automatically.
    required: true
  env:
    description: >
      Newline-separated KEY=VALUE pairs forwarded into the container as
      environment variables. Blank lines and `#` comments are ignored. Values
      may contain arbitrary characters (they are not parsed by the shell).
    required: false
    default: ''
  pull:
    description: >
      When 'true' (default), `docker pull` the image before running. Set to
      'false' only if you are certain the image is already present (e.g., an
      earlier step in the same job built it).
    required: false
    default: 'true'
  pre_script:
    description: >
      Optional bash snippet executed inside the container AFTER
      `source .devcontainer/configure-ai.sh` and BEFORE envsubst expands
      the prompt file. Use this to decode base64 env vars, fetch data via
      `gh api`, or set derived variables that the prompt template
      references. Any variables exported here are visible to envsubst.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Log in to GHCR
      shell: bash
      env:
        GHCR_USERNAME: ${{ github.actor }}
        GHCR_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

    - name: Pull CI image
      if: inputs.pull == 'true'
      shell: bash
      run: docker pull "${{ inputs.image }}"

    - name: Stage env + pre-script files
      id: stage-files
      shell: bash
      env:
        ENV_INPUT: ${{ inputs.env }}
        PRE_SCRIPT_INPUT: ${{ inputs.pre_script }}
      run: |
        set -euo pipefail
        # The pre-script file needs to be visible to the docker daemon that
        # resolves the `-v` bind mount. On the self-hosted runner, that
        # daemon runs on the host (dockergeneric), not inside the runner
        # container — so files under /tmp (the runner's private /tmp) are
        # NOT host-visible and bind-mounting them ends up materializing a
        # root-owned empty directory at the mount target.
        #
        # $RUNNER_TEMP lives inside /tmp/runner-work-<repo>-<N>/_temp/,
        # which IS bind-mounted from host → runner. Files written here are
        # host-visible at the same absolute path. This is also why the
        # workspace bind mount works end-to-end.
        STAGING_DIR="${RUNNER_TEMP:-/tmp}/ci-agent"
        mkdir -p "$STAGING_DIR"
        ENV_FILE="$(mktemp "${STAGING_DIR}/env.XXXXXX")"
        PRE_SCRIPT_FILE="$(mktemp "${STAGING_DIR}/pre-script.XXXXXX.sh")"
        # Filter blank lines and comment lines in env input; pass the rest through.
        printf '%s\n' "$ENV_INPUT" \
          | grep -Ev '^\s*(#|$)' \
          > "$ENV_FILE" || true
        chmod 600 "$ENV_FILE"
        # The pre-script goes in verbatim (or empty).
        printf '%s\n' "$PRE_SCRIPT_INPUT" > "$PRE_SCRIPT_FILE"
        chmod 600 "$PRE_SCRIPT_FILE"
        echo "env_file=$ENV_FILE" >> "$GITHUB_OUTPUT"
        echo "pre_script_file=$PRE_SCRIPT_FILE" >> "$GITHUB_OUTPUT"

    - name: Run agent
      shell: bash
      env:
        CI_AGENT_IMAGE: ${{ inputs.image }}
        CI_AGENT_PROMPT_FILE: ${{ inputs.prompt_file }}
        CI_AGENT_OUTPUT_FILE: ${{ inputs.output_file }}
        CI_AGENT_ENV_FILE: ${{ steps.stage-files.outputs.env_file }}
        CI_AGENT_PRE_SCRIPT_FILE: ${{ steps.stage-files.outputs.pre_script_file }}
      run: |
        set -euo pipefail

        OUTPUT_DIR="$(dirname "$CI_AGENT_OUTPUT_FILE")"
        mkdir -p "$OUTPUT_DIR"

        # Mount the pre-script into a known path inside the container; the
        # wrapper below sources it so any vars it exports are visible to
        # envsubst.
        docker run --rm \
          --network host \
          --workdir /workspace \
          -v "${{ github.workspace }}:/workspace" \
          -v "$OUTPUT_DIR:$OUTPUT_DIR" \
          -v "$CI_AGENT_PRE_SCRIPT_FILE:/tmp/ci-agent-pre-script.sh:ro" \
          --env-file "$CI_AGENT_ENV_FILE" \
          -e CI_AGENT_PROMPT_FILE \
          -e CI_AGENT_OUTPUT_FILE \
          "$CI_AGENT_IMAGE" \
          -lc '
            set -euo pipefail
            source .devcontainer/configure-ai.sh
            if [ -s /tmp/ci-agent-pre-script.sh ]; then
              # shellcheck disable=SC1091
              source /tmp/ci-agent-pre-script.sh
            fi
            PROMPT=$(envsubst < "$CI_AGENT_PROMPT_FILE")
            bash .devcontainer/run-ai.sh "$PROMPT" 2>&1 \
              | tee "$CI_AGENT_OUTPUT_FILE"
          '

    - name: Clean up staged files
      if: always()
      shell: bash
      env:
        CI_AGENT_ENV_FILE: ${{ steps.stage-files.outputs.env_file }}
        CI_AGENT_PRE_SCRIPT_FILE: ${{ steps.stage-files.outputs.pre_script_file }}
      run: rm -f "$CI_AGENT_ENV_FILE" "$CI_AGENT_PRE_SCRIPT_FILE"
