name: Codex

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

concurrency:
  group: >-
    codex-interactive-${{
      github.event_name == 'pull_request_review_comment' && github.event.pull_request.number ||
      github.event_name == 'pull_request_review' && github.event.pull_request.number ||
      github.event.issue.number
    }}
  cancel-in-progress: true

# SECURITY NOTE: This workflow grants Codex access to secrets and write permissions.
# Authorization checks are implemented to prevent prompt injection from untrusted users.
# Only repository collaborators, members, and owners can trigger Codex.

env:
  # Note: must be lowercase for Docker compatibility
  DEVCONTAINER_IMAGE: ghcr.io/nickborgers/home-automation-devcontainer

jobs:
  # Security gate: Check if the actor is authorized to trigger Codex
  # This prevents prompt injection attacks from untrusted external users
  authorize:
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.check-auth.outputs.authorized }}
    steps:
      - name: Check authorization
        id: check-auth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get the author association based on event type
          EVENT_NAME="${{ github.event_name }}"

          case "$EVENT_NAME" in
            issue_comment)
              AUTHOR_ASSOC="${{ github.event.comment.author_association }}"
              ACTOR="${{ github.event.comment.user.login }}"
              ;;
            pull_request_review_comment)
              AUTHOR_ASSOC="${{ github.event.comment.author_association }}"
              ACTOR="${{ github.event.comment.user.login }}"
              ;;
            pull_request_review)
              AUTHOR_ASSOC="${{ github.event.review.author_association }}"
              ACTOR="${{ github.event.review.user.login }}"
              ;;
            issues)
              AUTHOR_ASSOC="${{ github.event.issue.author_association }}"
              ACTOR="${{ github.event.issue.user.login }}"
              ;;
            *)
              echo "Unknown event type: $EVENT_NAME"
              echo "authorized=false" >> $GITHUB_OUTPUT
              exit 0
              ;;
          esac

          echo "Event: $EVENT_NAME"
          echo "Actor: $ACTOR"
          echo "Author association: $AUTHOR_ASSOC"

          # Allow: OWNER, MEMBER, COLLABORATOR
          # Deny: CONTRIBUTOR, FIRST_TIMER, FIRST_TIME_CONTRIBUTOR, MANNEQUIN, NONE
          case "$AUTHOR_ASSOC" in
            OWNER|MEMBER|COLLABORATOR)
              echo "✅ Authorized: $ACTOR is a $AUTHOR_ASSOC"
              echo "authorized=true" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "❌ Not authorized: $ACTOR is a $AUTHOR_ASSOC"
              echo "External users cannot trigger Codex workflows."
              echo "This is a security measure to prevent prompt injection attacks."
              echo "authorized=false" >> $GITHUB_OUTPUT
              ;;
          esac

  # Build and cache devcontainer image first
  # Optimization: Skip build if .devcontainer/ files haven't changed
  # This saves ~1 minute per run when devcontainer is unchanged
  build-devcontainer:
    needs: authorize
    if: |
      needs.authorize.outputs.authorized == 'true' &&
      (
        (github.event_name == 'issues') ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@codex')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@codex')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@codex'))
      )
    runs-on: [self-hosted, homelab]
    permissions:
      contents: read
      packages: write
    outputs:
      should-build: ${{ steps.check-changes.outputs.should-build }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Shallow clone suffices; change detection uses GitHub API, not local git history

      - name: Check if devcontainer files changed
        id: check-changes
        run: |
          # Check if this is the first run or if devcontainer files changed
          if [ "${{ github.event_name }}" = "issues" ] && [ "${{ github.event.action }}" = "opened" ]; then
            # For new issues, always check if devcontainer needs update
            DEVCONTAINER_CHANGED="true"
          else
            # For PR comments, check if devcontainer files changed in the PR
            if [ -n "${{ github.event.issue.pull_request || github.event.pull_request.number }}" ]; then
              PR_NUMBER="${{ github.event.issue.number || github.event.pull_request.number }}"
              # Get list of changed files in the PR
              CHANGED_FILES=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')
              if echo "$CHANGED_FILES" | grep -q "^\.devcontainer/"; then
                DEVCONTAINER_CHANGED="true"
              else
                DEVCONTAINER_CHANGED="false"
              fi
            else
              # For non-PR contexts, always build to be safe
              DEVCONTAINER_CHANGED="true"
            fi
          fi

          # Check if the image exists in GHCR
          if docker manifest inspect ghcr.io/nickborgers/home-automation-devcontainer:latest >/dev/null 2>&1; then
            IMAGE_EXISTS="true"
          else
            IMAGE_EXISTS="false"
            DEVCONTAINER_CHANGED="true"  # Force build if image doesn't exist
          fi

          if [ "$DEVCONTAINER_CHANGED" = "true" ] || [ "$IMAGE_EXISTS" = "false" ]; then
            echo "should-build=true" >> $GITHUB_OUTPUT
            echo "✅ Devcontainer will be built (changed=$DEVCONTAINER_CHANGED, exists=$IMAGE_EXISTS)"
          else
            echo "should-build=false" >> $GITHUB_OUTPUT
            echo "⏭️  Skipping devcontainer build (no changes detected)"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Log in to GHCR
        if: steps.check-changes.outputs.should-build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push devcontainer
        if: steps.check-changes.outputs.should-build == 'true'
        uses: devcontainers/ci@v0.3
        with:
          imageName: ${{ env.DEVCONTAINER_IMAGE }}
          cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}
          push: always

  codex:
    needs: [authorize, build-devcontainer]
    if: |
      needs.authorize.outputs.authorized == 'true' &&
      ((github.event_name == 'issue_comment' && contains(github.event.comment.body, '@codex')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@codex')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@codex')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@codex') || contains(github.event.issue.title, '@codex'))))
    runs-on: [self-hosted, homelab]
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
      packages: read

    steps:
      - name: Get PR context
        id: pr-context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Determine if this is a PR comment and get PR details
          IS_PR="false"
          PR_HEAD_REF=""
          PR_NUMBER=""

          if [ "${{ github.event_name }}" = "pull_request_review_comment" ]; then
            IS_PR="true"
            PR_NUMBER="${{ github.event.pull_request.number }}"
            PR_HEAD_REF="${{ github.event.pull_request.head.ref }}"
          elif [ "${{ github.event_name }}" = "pull_request_review" ]; then
            IS_PR="true"
            PR_NUMBER="${{ github.event.pull_request.number }}"
            PR_HEAD_REF="${{ github.event.pull_request.head.ref }}"
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            # Check if the issue is actually a PR
            if [ -n "${{ github.event.issue.pull_request }}" ]; then
              IS_PR="true"
              PR_NUMBER="${{ github.event.issue.number }}"
              # Fetch PR details to get head ref
              PR_HEAD_REF=$(gh api repos/${{ github.repository }}/pulls/${PR_NUMBER} --jq '.head.ref')
            fi
          fi

          echo "is_pr=$IS_PR" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "pr_head_ref=$PR_HEAD_REF" >> $GITHUB_OUTPUT
          echo "Detected: IS_PR=$IS_PR, PR_NUMBER=$PR_NUMBER, PR_HEAD_REF=$PR_HEAD_REF"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_PAT }}  # PAT required to push workflow file changes
          ref: ${{ steps.pr-context.outputs.is_pr == 'true' && steps.pr-context.outputs.pr_head_ref || github.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Note: GH_TOKEN uses WORKFLOW_PAT because PRs created with GITHUB_TOKEN don't trigger workflows
      - name: Run Codex in devcontainer
        uses: devcontainers/ci@v0.3
        with:
          imageName: ${{ env.DEVCONTAINER_IMAGE }}
          cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}
          push: never
          env: |
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            GH_TOKEN=${{ secrets.WORKFLOW_PAT }}
            EVENT_NAME=${{ github.event_name }}
            COMMENT_ID=${{ github.event.comment.id }}
            REVIEW_ID=${{ github.event.review.id }}
            PR_NUMBER=${{ github.event.pull_request.number }}
            ISSUE_NUMBER=${{ github.event.issue.number || github.event.pull_request.number }}
            REPO=${{ github.repository }}
            IS_PR=${{ steps.pr-context.outputs.is_pr }}
            PR_HEAD_REF=${{ steps.pr-context.outputs.pr_head_ref }}
          runCmd: |
            source .devcontainer/configure-codex.sh

            # Fetch comment/review/issue body via API to avoid Docker env escaping issues
            # Multi-line content with special characters breaks docker exec -e args
            # (see https://github.com/NickBorgers/home-automation/issues/950)
            case "$EVENT_NAME" in
              issue_comment)
                COMMENT_BODY=$(gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" --jq '.body // ""')
                ;;
              pull_request_review_comment)
                COMMENT_BODY=$(gh api "repos/${REPO}/pulls/comments/${COMMENT_ID}" --jq '.body // ""')
                ;;
              pull_request_review)
                COMMENT_BODY=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews/${REVIEW_ID}" --jq '.body // ""')
                ;;
              issues)
                COMMENT_BODY=$(gh api "repos/${REPO}/issues/${ISSUE_NUMBER}" --jq '.body // ""')
                ;;
            esac

            # Build the prompt based on whether this is a PR or issue comment
            if [ "$IS_PR" = "true" ]; then
              PROMPT="You are an autonomous agent responding to a request on PR #${ISSUE_NUMBER} in ${REPO}.

            The user said: ${COMMENT_BODY}

            YOUR TASK: IMPLEMENT the requested changes. Do NOT just provide review comments or suggestions.

            WORKFLOW:
            1. Read the user's request carefully
            2. If they reference another comment, fetch it: gh api repos/${REPO}/issues/${ISSUE_NUMBER}/comments
            3. Understand what changes are needed
            4. Implement the changes in the code
            5. Run \`make unit-tests\` to verify your changes work
            6. Commit your changes with a descriptive message
            7. Push to the PR branch: git push origin ${PR_HEAD_REF}
            8. Post a summary comment: gh pr comment ${ISSUE_NUMBER} --body 'YOUR_SUMMARY'

            IMPORTANT RULES FOR THIS REPOSITORY:
            - Use \`make unit-tests\` NOT \`go test\` (caching)
            - Use \`make integration-tests\` for integration tests
            - Use \`make pre-commit\` for linting/formatting
            - Follow shadow state pattern (docs/reference/SHADOW_STATE.md)
            - Never use \`git push --no-verify\`

            TDD FOR CROSS-PLUGIN FEATURES:
            - If implementing a feature that spans multiple plugins, write the user story test FIRST
            - User story tests go in test/integration/scenario_*_test.go
            - Tests should verify behavior from the user's perspective using GIVEN/WHEN/THEN
            - Document invariants: rules that should ALWAYS hold (e.g., 'isWakeSequenceActive=true blocks sleep music')
            - Test the full timeline, not just end states (T+0, T+2min, T+5min)
            - Reference: scenario_sleephygiene_test.go for TDD-style cross-plugin tests

            You are on branch ${PR_HEAD_REF}. Make the changes, commit, and push them."
            else
              PROMPT="You are responding to a request in ${REPO} issue #${ISSUE_NUMBER}.

            The user said: ${COMMENT_BODY}

            IMPORTANT RULES FOR THIS REPOSITORY:
            - Use \`make unit-tests\` NOT \`go test\` (caching)
            - Use \`make integration-tests\` for integration tests
            - Use \`make pre-commit\` for linting/formatting
            - Follow shadow state pattern (docs/reference/SHADOW_STATE.md)
            - Never use \`git push --no-verify\`

            TDD FOR CROSS-PLUGIN FEATURES:
            - If implementing a feature that spans multiple plugins, write the user story test FIRST
            - User story tests go in test/integration/scenario_*_test.go
            - Tests should verify behavior from the user's perspective using GIVEN/WHEN/THEN
            - Document invariants: rules that should ALWAYS hold (e.g., 'isWakeSequenceActive=true blocks sleep music')
            - Test the full timeline, not just end states (T+0, T+2min, T+5min)
            - Reference: scenario_sleephygiene_test.go for TDD-style cross-plugin tests

            Complete the user's request. If you make changes, create a branch, commit them, and open a PR.
            Reply to the user using: gh issue comment ${ISSUE_NUMBER} --body 'YOUR_RESPONSE'"
            fi

            codex exec \
              --json \
              --dangerously-bypass-approvals-and-sandbox \
              "$PROMPT" 2>&1 | tee /tmp/codex-conversation.jsonl

      - name: Upload Codex conversation log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codex-conversation-log
          path: /tmp/codex-conversation.jsonl
          retention-days: 7

  # Auto-resolve new issues by opening a PR
  resolve-issue:
    needs: [authorize, build-devcontainer]
    if: |
      needs.authorize.outputs.authorized == 'true' &&
      github.event_name == 'issues' && (github.event.action == 'opened' || github.event.action == 'assigned')
    runs-on: [self-hosted, homelab]
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_PAT }}  # PAT required to push workflow file changes

      - name: Label issue as codex-started
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Create the label if it doesn't exist (ignore error if it does)
          gh label create "codex-started" --color "7057ff" --description "Codex is working on this issue" --repo ${{ github.repository }} 2>/dev/null || true
          # Add the label to the issue
          gh issue edit ${{ github.event.issue.number }} --add-label "codex-started" --repo ${{ github.repository }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Note: GH_TOKEN uses WORKFLOW_PAT because PRs created with GITHUB_TOKEN don't trigger workflows
      - name: Resolve issue in Codex
        uses: devcontainers/ci@v0.3
        with:
          imageName: ${{ env.DEVCONTAINER_IMAGE }}
          cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}
          push: never
          env: |
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            GH_TOKEN=${{ secrets.WORKFLOW_PAT }}
            ISSUE_NUMBER=${{ github.event.issue.number }}
            ISSUE_TITLE=${{ github.event.issue.title }}
            REPO=${{ github.repository }}
          runCmd: |
            source .devcontainer/configure-codex.sh

            # Fetch issue body via API to avoid multi-line env var escaping issues
            # (see https://github.com/NickBorgers/home-automation/issues/441)
            ISSUE_BODY=$(gh api "repos/${REPO}/issues/${ISSUE_NUMBER}" --jq '.body')

            # Fetch all comments on the issue (may contain additional context/requirements)
            ISSUE_COMMENTS=$(gh api "repos/${REPO}/issues/${ISSUE_NUMBER}/comments" --jq '.[] | "---\n**\(.user.login)** commented at \(.created_at):\n\(.body)\n"' 2>/dev/null | head -c 50000 || echo "")

            codex exec \
              --json \
              --dangerously-bypass-approvals-and-sandbox \
              "You are an autonomous agent tasked with resolving GitHub issue #${ISSUE_NUMBER}.

            ISSUE TITLE: ${ISSUE_TITLE}

            ISSUE BODY:
            ${ISSUE_BODY}

            ISSUE COMMENTS (if any):
            ${ISSUE_COMMENTS}

            YOUR TASK:
            1. Analyze the issue and understand what needs to be done
            2. Explore the codebase to find relevant files
            3. Implement the fix or feature
            4. Run \`make unit-tests\` to verify your changes work
            5. Create a branch, commit your changes, and open a PR

            IMPORTANT RULES:
            - Use \`make unit-tests\` NOT \`go test\` (caching)
            - Use \`make integration-tests\` for integration tests
            - Use \`make pre-commit\` for linting/formatting
            - Follow shadow state pattern (docs/reference/SHADOW_STATE.md)
            - Never use \`git push --no-verify\`
            - Write the minimum code that solves the issue. No more.
            - Don't add helpers, utilities, or abstractions unless the issue requires them.
            - Don't refactor adjacent code or make unrelated improvements.
            - If three similar lines work, don't extract a function.

            TDD FOR CROSS-PLUGIN FEATURES:
            - If implementing a feature that spans multiple plugins, write the user story test FIRST
            - User story tests go in test/integration/scenario_*_test.go
            - Tests should verify behavior from the user's perspective using GIVEN/WHEN/THEN
            - Document invariants: rules that should ALWAYS hold (e.g., 'isWakeSequenceActive=true blocks sleep music')
            - Test the full timeline, not just end states (T+0, T+2min, T+5min)
            - Reference: scenario_sleephygiene_test.go for TDD-style cross-plugin tests

            BEFORE CREATING THE PR — SELF-REVIEW:
            6. Run \`git diff --stat\` and verify ONLY issue-scoped changes remain.
               If the diff includes code beyond the issue scope, REMOVE IT.
               The fix should be the smallest correct change.
            7. For any new external service calls: verify retry logic and appropriate timeouts.
            8. For any new test helpers with shared state: verify mutex protection.
            9. Verify new tests exercise the CURRENT production code path, not a legacy path.

            BRANCH NAMING: Use \`codex/issue-${ISSUE_NUMBER}\` as the branch name.

            PR CREATION:
            gh pr create --title 'Fix #${ISSUE_NUMBER}: <brief description>' \\
              --body 'Resolves #${ISSUE_NUMBER}

            ## Summary
            <describe what you changed>

            ## Test Plan
            <how to verify the fix>

            🤖 Generated with Codex' \\
              --head codex/issue-${ISSUE_NUMBER}

            If you cannot resolve the issue (unclear requirements, needs human decision, etc.),
            comment on the issue explaining what clarification is needed:
            gh issue comment ${ISSUE_NUMBER} --body 'YOUR_EXPLANATION'" 2>&1 | tee /tmp/resolve-issue-conversation.jsonl

      - name: Upload issue resolution conversation log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resolve-issue-conversation-log
          path: /tmp/resolve-issue-conversation.jsonl
          retention-days: 7
