name: HA Deprecation Check

# Monthly check for deprecated Home Assistant APIs
# Scans HA release notes for deprecations and checks codebase for usage
# Creates issues for any deprecated API usage found, which the existing
# AI Assistant workflow's resolve-issue job will auto-fix

# SECURITY NOTE: This workflow has low prompt injection risk because:
# - Schedule trigger is not user-controlled
# - workflow_dispatch IS user-controlled (requires repo write access): the ha_version input
#   is validated against a strict version pattern (YYYY.M[.P]) before use
# - It analyzes HA release notes and codebase, not arbitrary user-provided content
# - It only creates issues (write) and reads code (read)

on:
  schedule:
    # Run on the 5th of each month at 10am UTC
    # HA typically releases on the first Wednesday of each month
    - cron: '0 10 5 * *'
  workflow_dispatch:
    inputs:
      ha_version:
        description: 'Specific HA version to check (e.g., 2026.3). Leave empty to check latest releases.'
        required: false
        type: string

concurrency:
  group: ha-deprecation-check
  cancel-in-progress: true

env:
  CI_IMAGE: ghcr.io/nickborgers/home-automation-ci:latest

jobs:
  check-deprecations:
    runs-on: [self-hosted, homelab]
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate ha_version input
        if: inputs.ha_version != ''
        env:
          HA_VERSION: ${{ inputs.ha_version }}
        run: |
          if ! echo "$HA_VERSION" | grep -qP '^\d{4}\.\d{1,2}(\.\d+)?$'; then
            echo "::error::Invalid HA version format '${HA_VERSION}'. Expected format: YYYY.M or YYYY.M.P (e.g., 2026.3)"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull CI image
        run: docker pull "${CI_IMAGE}"

      # Note: GH_TOKEN uses WORKFLOW_PAT so created issues trigger the resolve-issue job in the AI assistant workflow
      # (issues created with GITHUB_TOKEN don't trigger other workflows)
      - name: Check for deprecated HA APIs with AI assistant
        env:
          AI_API_KEY: ${{ vars.AI_API_KEY }}
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          REPO: ${{ github.repository }}
          HA_VERSION: ${{ inputs.ha_version || '' }}
        run: |
          set -euo pipefail
          OUTPUT_DIR="${{ runner.temp }}/deprecation-output"
          mkdir -p "$OUTPUT_DIR"

          # The HA_VERSION_LINE paragraph swaps based on whether a specific
          # HA version was passed as an input. Computing it here (rather than
          # embedding `$(…)` command substitution inside the prompt template)
          # keeps the prompt file purely textual and envsubst-safe.
          if [ -n "$HA_VERSION" ]; then
            HA_VERSION_LINE=$(printf 'CHECK SPECIFIC VERSION: %s\nFetch the release notes for HA %s from https://www.home-assistant.io/blog/' "$HA_VERSION" "$HA_VERSION")
          else
            HA_VERSION_LINE="Check the LAST 3 HA releases."
          fi
          export HA_VERSION_LINE

          docker run --rm \
            --network host \
            --workdir /workspace \
            -v "${{ github.workspace }}:/workspace" \
            -v "$OUTPUT_DIR:/tmp/deprecation-output" \
            -e AI_API_KEY \
            -e GH_TOKEN \
            -e REPO \
            -e HA_VERSION \
            -e HA_VERSION_LINE \
            "${CI_IMAGE}" \
            -lc '
              set -euo pipefail
              source .devcontainer/configure-ai.sh

              PROMPT=$(envsubst < .github/ci/prompts/deprecation-check.md)
              bash .devcontainer/run-ai.sh "$PROMPT" 2>&1 \
                | tee /tmp/deprecation-output/deprecation-check-output.jsonl
            '

      - name: Upload deprecation check output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deprecation-check-output
          path: ${{ runner.temp }}/deprecation-output/deprecation-check-output.jsonl
          retention-days: 30  # Intentionally longer than 7-day default since this runs monthly

      - name: Validate deprecation check result
        if: always()
        run: |
          OUTPUT_FILE="${{ runner.temp }}/deprecation-output/deprecation-check-output.jsonl"
          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "::error::Deprecation check output file not found"
            exit 1
          fi

          # Extract the RESULT summary line from the AI's output
          # The stream-json format wraps content in JSON, so search for the RESULT marker
          if grep -q "RESULT: NO_DEPRECATIONS_FOUND" "$OUTPUT_FILE"; then
            echo "✅ No deprecated APIs found in codebase"
            echo "## Deprecation Check: Clean" >> $GITHUB_STEP_SUMMARY
            echo "No deprecated Home Assistant APIs found in the codebase." >> $GITHUB_STEP_SUMMARY
          elif grep -q "RESULT: ISSUES_CREATED" "$OUTPUT_FILE"; then
            COUNT=$(grep -oP 'RESULT: ISSUES_CREATED \K\d+' "$OUTPUT_FILE" || echo "?")
            echo "⚠️ Created $COUNT issue(s) for deprecated API usage"
            echo "## Deprecation Check: Issues Created" >> $GITHUB_STEP_SUMMARY
            echo "Created **$COUNT** issue(s) for deprecated HA API usage." >> $GITHUB_STEP_SUMMARY
            echo "The resolve-issue pipeline will auto-fix these." >> $GITHUB_STEP_SUMMARY
          elif grep -q "RESULT: ALL_DUPLICATES" "$OUTPUT_FILE"; then
            echo "ℹ️ All deprecations already tracked in existing issues"
            echo "## Deprecation Check: Already Tracked" >> $GITHUB_STEP_SUMMARY
            echo "All found deprecations are already tracked in existing issues." >> $GITHUB_STEP_SUMMARY
          elif grep -q "RESULT: FETCH_FAILED" "$OUTPUT_FILE"; then
            echo "::error::Failed to fetch HA release notes - results may be incomplete"
            echo "## Deprecation Check: Fetch Failed ❌" >> $GITHUB_STEP_SUMMARY
            echo "Could not fetch Home Assistant release notes." >> $GITHUB_STEP_SUMMARY
            echo "Check the deprecation-check-output artifact for details." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "::error::Could not determine deprecation check outcome from AI output"
            echo "## Deprecation Check: Unknown Result ❌" >> $GITHUB_STEP_SUMMARY
            echo "Could not parse the check result. Review the deprecation-check-output artifact." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
