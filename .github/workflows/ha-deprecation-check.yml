name: HA Deprecation Check

# Monthly check for deprecated Home Assistant APIs
# Scans HA release notes for deprecations and checks codebase for usage
# Creates issues for any deprecated API usage found, which the existing
# claude.yml resolve-issue job will auto-fix

# SECURITY NOTE: This workflow has low prompt injection risk because:
# - It only triggers on schedule or manual dispatch (not user-controlled events)
# - It analyzes HA release notes and codebase, not user-provided content
# - It only creates issues (write) and reads code (read)

on:
  schedule:
    # Run on the 5th of each month at 10am UTC
    # HA typically releases on the first Wednesday of each month
    - cron: '0 10 5 * *'
  workflow_dispatch:
    inputs:
      ha_version:
        description: 'Specific HA version to check (e.g., 2026.3). Leave empty to check latest releases.'
        required: false
        type: string

concurrency:
  group: ha-deprecation-check
  cancel-in-progress: true

env:
  DEVCONTAINER_IMAGE: ghcr.io/nickborgers/home-automation-devcontainer

jobs:
  # Optimization: Skip devcontainer build if image already exists in GHCR.
  # Other workflows (claude.yml, pr-tests) rebuild when .devcontainer/ changes,
  # so for a monthly scheduled job we just need to ensure the image is available.
  build-devcontainer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      should-build: ${{ steps.check-image.outputs.should-build }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if devcontainer image exists
        id: check-image
        run: |
          if docker manifest inspect ghcr.io/nickborgers/home-automation-devcontainer:latest >/dev/null 2>&1; then
            echo "should-build=false" >> $GITHUB_OUTPUT
            echo "⏭️  Skipping devcontainer build (image already exists in GHCR)"
          else
            echo "should-build=true" >> $GITHUB_OUTPUT
            echo "✅ Devcontainer will be built (image not found in GHCR)"
          fi

      - name: Log in to GHCR
        if: steps.check-image.outputs.should-build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push devcontainer
        if: steps.check-image.outputs.should-build == 'true'
        uses: devcontainers/ci@v0.3
        with:
          imageName: ${{ env.DEVCONTAINER_IMAGE }}
          cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}
          push: always

  check-deprecations:
    needs: build-devcontainer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create gh config directory for devcontainer mount
        run: mkdir -p ~/.config/gh

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Note: GH_TOKEN uses WORKFLOW_PAT so created issues trigger the resolve-issue job in claude.yml
      # (issues created with GITHUB_TOKEN don't trigger other workflows)
      - name: Check for deprecated HA APIs with Claude
        uses: devcontainers/ci@v0.3
        with:
          imageName: ${{ env.DEVCONTAINER_IMAGE }}
          cacheFrom: ${{ env.DEVCONTAINER_IMAGE }}
          push: never
          env: |
            CLAUDE_CODE_OAUTH_TOKEN=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
            GH_TOKEN=${{ secrets.WORKFLOW_PAT }}
            REPO=${{ github.repository }}
            HA_VERSION=${{ inputs.ha_version || '' }}
          runCmd: |
            # Using Sonnet: This is a classification/search task, not deep reasoning
            claude --print \
              --verbose \
              --output-format stream-json \
              --model sonnet \
              --dangerously-skip-permissions \
              --max-turns 200 \
              "You are a Home Assistant deprecation checker. Your job is to find deprecated HA APIs
            that this codebase still uses, and create GitHub issues so they get fixed proactively.

            PHASE 1: GATHER DEPRECATIONS
            =============================
            Fetch the Home Assistant release notes to identify deprecated APIs.

            $(if [ -n "${HA_VERSION}" ]; then echo "CHECK SPECIFIC VERSION: ${HA_VERSION}"; echo "Fetch the release notes for HA ${HA_VERSION} from https://www.home-assistant.io/blog/"; else echo "Check the LAST 3 HA releases."; fi)

            Fetch release notes from https://www.home-assistant.io/blog/categories/release-notes/
            For each release, look for:
            - Deprecated service calls (e.g., service parameters renamed or removed)
            - Deprecated entity attributes
            - Breaking changes to WebSocket API
            - Deprecated YAML configuration options
            - Parameters that have been renamed (e.g., color_temp -> color_temp_kelvin)
            - Services that have been renamed or split

            Also check these known deprecation patterns that HA has introduced over time:
            - light.turn_on: color_temp (deprecated) -> color_temp_kelvin
            - light.turn_on: brightness (0-255) still works but brightness_pct (0-100) is preferred
            - media_player service consolidation changes
            - Climate entity mode changes

            IMPORTANT: If you CANNOT fetch the release notes page (network error, timeout, empty
            response, or the page structure has changed and you can't find release content), you
            MUST output exactly:
              FETCH_FAILED: Unable to retrieve HA release notes
            followed by a brief description of the error. Do NOT fall back to reporting
            NO_DEPRECATIONS_FOUND if you were unable to actually check the release notes.

            PHASE 2: SCAN CODEBASE
            =======================
            Search the codebase for usage of any deprecated APIs found in Phase 1.

            Focus on:
            - homeautomation-go/internal/plugins/ - all plugin code
            - configs/ - YAML configuration files
            - Look for CallService and CallServiceWithTarget calls
            - Look for entity attribute references
            - Look for WebSocket message construction

            Search patterns to check:
            - grep for deprecated parameter names in service call data maps
            - grep for deprecated service names
            - Check map literals passed to CallService/CallServiceWithTarget

            PHASE 3: REPORT
            ================
            If you find deprecated API usage in the codebase:

            1. First check for existing open issues with specific title matches to avoid duplicates:
               gh issue list --repo ${REPO} --label ha-deprecation --state open --json title,number

               Check whether each SPECIFIC deprecation you found already has an open issue by
               comparing the deprecated API name against existing issue titles. For example, if
               you found deprecated usage of 'color_temp', check if any open issue title contains
               'color_temp'. Only skip creating an issue for deprecations that are already covered
               by an existing open issue. Create new issues for any NEW deprecations not yet reported.

            2. If creating new issues, ensure the ha-deprecation label exists:
               gh label create \"ha-deprecation\" --color \"d93f0b\" --description \"Deprecated Home Assistant API usage\" --repo ${REPO} 2>/dev/null || true

            3. Create ONE GitHub issue PER deprecated API, with a specific title including the API name:
               gh issue create --repo ${REPO} \
                 --title '@claude Replace deprecated HA API: <specific_api_name>' \
                 --label 'ha-deprecation' \
                 --body '<issue body>'

               For example:
                 --title '@claude Replace deprecated HA API: color_temp in light.turn_on'
                 --title '@claude Replace deprecated HA API: old_service_name'

               The issue body MUST include:
               - Which deprecated APIs were found and in which files (with line numbers)
               - What each deprecated call should be replaced with
               - Links to the relevant HA release notes
               - A clear description of what changes are needed

               Example issue body format:
               ## Deprecated HA API Usage Found

               The following deprecated Home Assistant APIs are used in this codebase:

               ### 1. \`deprecated_param\` in \`file.go:123\`
               - **Current**: Uses \`deprecated_param\` in \`service.call\`
               - **Replace with**: \`new_param\`
               - **HA Release**: [2026.3 Release Notes](url)

               ## Required Changes
               - Update \`file.go\` to use \`new_param\` instead of \`deprecated_param\`

               ---
               🤖 Generated by HA Deprecation Check workflow

            4. For each deprecation, if a matching open issue already exists (title contains the
               same API name), skip it and output: DUPLICATE_ISSUE_EXISTS: <api_name> - already tracked in #<number>

            If NO deprecated usage is found in the codebase:
            Output: NO_DEPRECATIONS_FOUND
            This is a successful outcome - the codebase is up to date.

            FINAL OUTPUT:
            =============
            As your very last output, print exactly ONE of these summary lines:
            - RESULT: NO_DEPRECATIONS_FOUND
            - RESULT: ISSUES_CREATED <count>
            - RESULT: ALL_DUPLICATES
            - RESULT: FETCH_FAILED
            This summary line is used by the workflow to determine the outcome.

            IMPORTANT:
            - Be thorough in scanning - check ALL plugin files
            - Only report deprecations that actually affect code in THIS repository
            - Do not report theoretical deprecations that aren't used here
            - Include specific file paths and line numbers in the issue" < /dev/null 2>&1 | tee /workspaces/home-automation/deprecation-check-output.jsonl

      - name: Upload deprecation check output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deprecation-check-output
          path: deprecation-check-output.jsonl
          retention-days: 30  # Intentionally longer than 7-day default since this runs monthly

      - name: Validate deprecation check result
        if: always()
        run: |
          OUTPUT_FILE="deprecation-check-output.jsonl"
          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "::error::Deprecation check output file not found"
            exit 1
          fi

          # Extract the RESULT summary line from Claude's output
          # The stream-json format wraps content in JSON, so search for the RESULT marker
          if grep -q "RESULT: NO_DEPRECATIONS_FOUND" "$OUTPUT_FILE"; then
            echo "✅ No deprecated APIs found in codebase"
            echo "## Deprecation Check: Clean" >> $GITHUB_STEP_SUMMARY
            echo "No deprecated Home Assistant APIs found in the codebase." >> $GITHUB_STEP_SUMMARY
          elif grep -q "RESULT: ISSUES_CREATED" "$OUTPUT_FILE"; then
            COUNT=$(grep -oP 'RESULT: ISSUES_CREATED \K\d+' "$OUTPUT_FILE" || echo "?")
            echo "⚠️ Created $COUNT issue(s) for deprecated API usage"
            echo "## Deprecation Check: Issues Created" >> $GITHUB_STEP_SUMMARY
            echo "Created **$COUNT** issue(s) for deprecated HA API usage." >> $GITHUB_STEP_SUMMARY
            echo "The resolve-issue pipeline will auto-fix these." >> $GITHUB_STEP_SUMMARY
          elif grep -q "RESULT: ALL_DUPLICATES" "$OUTPUT_FILE"; then
            echo "ℹ️ All deprecations already tracked in existing issues"
            echo "## Deprecation Check: Already Tracked" >> $GITHUB_STEP_SUMMARY
            echo "All found deprecations are already tracked in existing issues." >> $GITHUB_STEP_SUMMARY
          elif grep -q "RESULT: FETCH_FAILED" "$OUTPUT_FILE"; then
            echo "::error::Failed to fetch HA release notes - results may be incomplete"
            echo "## Deprecation Check: Fetch Failed ❌" >> $GITHUB_STEP_SUMMARY
            echo "Could not fetch Home Assistant release notes." >> $GITHUB_STEP_SUMMARY
            echo "Check the deprecation-check-output artifact for details." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "::warning::Could not determine deprecation check outcome from Claude output"
            echo "## Deprecation Check: Unknown Result ⚠️" >> $GITHUB_STEP_SUMMARY
            echo "Could not parse the check result. Review the deprecation-check-output artifact." >> $GITHUB_STEP_SUMMARY
          fi
