name: AI Code Review

# Dynamic run name shows PR number for easy identification in the Actions UI
# Format: "AI Code Review (PR #123)" or "AI Code Review (branch-name)"
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('AI Code Review (PR #{0})', inputs.pr_number) ||
      github.event_name == 'pull_request' && format('AI Code Review (PR #{0})', github.event.pull_request.number) ||
      github.event_name == 'issue_comment' && format('AI Code Review (PR #{0} /review)', github.event.issue.number) ||
      format('AI Code Review ({0})', github.event.workflow_run.head_branch) }}

# SECURITY NOTE: This workflow grants the AI assistant access to secrets and write permissions.
# Authorization checks are implemented to prevent prompt injection and code execution from untrusted users.
# - Only PRs from repository collaborators, members, and owners trigger AI reviews
# - The devcontainer is NEVER rebuilt from PR branches to prevent malicious Dockerfile injection
# - External PRs (from forks) are blocked from triggering AI reviews

on:
  workflow_run:
    workflows: ["PR Tests"]
    types: [completed]
  # Reset reviews when PR is reopened (allows re-triggering full review cycle)
  pull_request:
    types: [reopened]
  # Allow manual triggering after workflow_dispatch-triggered PR Tests completes
  # (workflow_run events don't fire for workflow_dispatch triggers)
  workflow_dispatch:
    inputs:
      head_ref:
        description: 'PR branch name'
        required: true
        type: string
      head_repo:
        description: 'PR repository (owner/repo format)'
        required: true
        type: string
      pr_number:
        description: 'PR number'
        required: true
        type: string
      tests_passed:
        description: 'Whether tests passed (true/false)'
        required: true
        type: string
      run_id:
        description: 'PR Tests workflow run ID'
        required: true
        type: string
  # Allow re-triggering reviews via /review comment on PR
  issue_comment:
    types: [created]

# Prevent duplicate reviews when multiple PR Tests complete around the same time
# Uses branch name for concurrency group
# cancel-in-progress: false ensures we complete the first review rather than restarting
concurrency:
  group: ai-review-${{ github.event_name == 'workflow_dispatch' && inputs.head_ref || github.event_name == 'issue_comment' && format('pr-{0}', github.event.issue.number) || github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  # CI agent image — see .github/ci/Dockerfile and .github/workflows/ci-image.yml
  CI_IMAGE: ghcr.io/nickborgers/home-automation-ci:latest

jobs:
  # Extract PR and Issue context from workflow_run or workflow_dispatch event
  get-context:
    runs-on: ubuntu-latest
    # For issue_comment events, skip the job entirely unless the comment contains /review.
    # This avoids running checkout, API calls, and JS steps for every bot/human comment.
    if: github.event_name != 'issue_comment' || contains(github.event.comment.body, '/review')
    # Note: For non-issue_comment events, we don't filter by event type here. The concurrency
    # group (line 36) prevents duplicate runs for the same branch, and downstream jobs skip
    # if no PR is found. This allows reviews to run even when push happens before PR creation.
    outputs:
      pr_number: ${{ steps.get-pr.outputs.pr_number }}
      pr_title: ${{ steps.get-pr.outputs.pr_title }}
      pr_body_b64: ${{ steps.get-pr.outputs.pr_body_b64 }}
      head_ref: ${{ steps.get-pr.outputs.head_ref }}
      head_repo: ${{ steps.get-pr.outputs.head_repo }}
      # Draft PR status - used to skip auto-fix pipeline for TDD workflows
      is_draft: ${{ steps.get-pr.outputs.is_draft }}
      # Handle workflow_run, workflow_dispatch, pull_request, and issue_comment events
      # For pull_request (reopen), tests haven't run yet so tests_passed is false
      # For issue_comment (/review), test status is looked up from check runs API
      # Defense-in-depth: also check the latest "All Required Tests" check run status
      # to guard against duplicate PR Tests runs where one passes and one fails
      tests_passed: ${{ github.event_name == 'issue_comment' && steps.review-command.outputs.tests_passed == 'true' || github.event_name == 'workflow_dispatch' && inputs.tests_passed == 'true' || github.event_name == 'pull_request' && 'false' || (github.event.workflow_run.conclusion == 'success' && steps.verify-test-status.outputs.verified != 'false') }}
      run_id: ${{ github.event_name == 'issue_comment' && steps.review-command.outputs.run_id || github.event_name == 'workflow_dispatch' && inputs.run_id || github.event_name == 'pull_request' && github.run_id || github.event.workflow_run.id }}
      # SHA that triggered this workflow - used to detect if author pushed newer commits
      triggering_sha: ${{ github.event_name == 'issue_comment' && steps.review-command.outputs.head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
      issue_number: ${{ steps.get-issue.outputs.issue_number }}
      issue_title: ${{ steps.get-issue.outputs.issue_title }}
      issue_body_b64: ${{ steps.get-issue.outputs.issue_body_b64 }}
      fix_attempts: ${{ steps.count-attempts.outputs.count }}
      reviews_already_passed: ${{ steps.check-existing-reviews.outputs.already_passed }}
      # SECURITY: Authorization status - blocks external/untrusted PR authors
      author_authorized: ${{ steps.check-author-auth.outputs.authorized }}
      # File classification - determines which reviews to run
      # config_only: true if PR only modifies files in configs/
      # has_go_code: true if PR modifies .go files
      config_only: ${{ steps.classify-files.outputs.config_only }}
      has_go_code: ${{ steps.classify-files.outputs.has_go_code }}
      cross_pr_context_b64: ${{ steps.generate-cross-pr-context.outputs.cross_pr_context_b64 }}

    steps:
      # Checkout needed for /review validation (has_plain_token.py)
      - name: Checkout for /review validation
        if: github.event_name == 'issue_comment'
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          fetch-depth: 1

      # Validate /review comment: must be on a PR, plain text, from a collaborator
      - name: Validate /review command
        if: github.event_name == 'issue_comment'
        id: review-command
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
        run: |
          # Must be a PR comment, not a plain issue comment
          if [ -z "${{ github.event.issue.pull_request.url }}" ]; then
            echo "Comment is on an issue, not a PR - skipping"
            echo "valid=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Validate /review is plain text (not in code blocks)
          PLAIN=$(printf %s "$COMMENT_BODY" | python3 .github/scripts/has_plain_token.py "/review")
          if [ "$PLAIN" != "true" ]; then
            echo "No plain-text /review found in comment body - skipping"
            echo "valid=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check comment author association
          AUTHOR_ASSOC="${{ github.event.comment.author_association }}"
          case "$AUTHOR_ASSOC" in
            OWNER|MEMBER|COLLABORATOR)
              echo "✅ Authorized: comment author is a $AUTHOR_ASSOC"
              ;;
            *)
              echo "❌ Not authorized: comment author is a $AUTHOR_ASSOC"
              echo "valid=false" >> $GITHUB_OUTPUT
              exit 0
              ;;
          esac

          # Fetch PR details
          PR_NUMBER="${{ github.event.issue.number }}"
          PR_JSON=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER)

          HEAD_REF=$(echo "$PR_JSON" | jq -r '.head.ref')
          HEAD_REPO=$(echo "$PR_JSON" | jq -r '.head.repo.full_name')
          IS_DRAFT=$(echo "$PR_JSON" | jq -r '.draft')
          HEAD_SHA=$(echo "$PR_JSON" | jq -r '.head.sha')

          echo "PR #$PR_NUMBER: head=$HEAD_REF repo=$HEAD_REPO draft=$IS_DRAFT sha=$HEAD_SHA"

          # Look up test status via check runs API
          STATUS=$(gh api repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs \
            --jq '[.check_runs[] | select(.name == "All Required Tests")] | sort_by(.completed_at) | last | .conclusion' 2>/dev/null || echo "")
          TESTS_PASSED="false"
          if [ "$STATUS" = "success" ]; then
            TESTS_PASSED="true"
          fi
          echo "Tests passed: $TESTS_PASSED (status: ${STATUS:-not found})"

          # Look up latest PR Tests run_id
          RUN_ID=$(gh run list --workflow="pr-tests.yml" --branch="$HEAD_REF" --limit=1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || echo "")
          echo "PR Tests run_id: $RUN_ID"

          echo "valid=true" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "head_ref=$HEAD_REF" >> $GITHUB_OUTPUT
          echo "head_repo=$HEAD_REPO" >> $GITHUB_OUTPUT
          echo "is_draft=$([ \"$IS_DRAFT\" = 'true' ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "tests_passed=$TESTS_PASSED" >> $GITHUB_OUTPUT
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "head_sha=$HEAD_SHA" >> $GITHUB_OUTPUT

      # Defense-in-depth: quick check of the latest "All Required Tests" status
      # Guards against duplicate PR Tests runs where one passes and one fails
      # This is a non-retrying check; per-reviewer verify-tests steps provide the second layer
      - name: Verify latest test status for commit
        if: github.event_name == 'workflow_run'
        id: verify-test-status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          echo "Quick-checking test status for commit $HEAD_SHA"

          # Check latest "All Required Tests" check run (non-retrying)
          STATUS=$(gh api repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs \
            --jq '[.check_runs[] | select(.name == "All Required Tests")] | sort_by(.completed_at) | last | .conclusion' 2>/dev/null || echo "")

          if [ "$STATUS" = "success" ]; then
            echo "✅ Latest 'All Required Tests' check passed"
            echo "verified=true" >> $GITHUB_OUTPUT
          elif [ "$STATUS" = "failure" ]; then
            echo "❌ Latest 'All Required Tests' check FAILED - blocking reviews"
            echo "verified=false" >> $GITHUB_OUTPUT
          else
            # If status is pending/unknown, don't block - let per-reviewer verify-tests handle it
            echo "⚠️ Test status is '${STATUS:-not found}' - deferring to per-reviewer checks"
            echo "verified=true" >> $GITHUB_OUTPUT
          fi

      - name: Get PR from workflow run or dispatch inputs
        uses: actions/github-script@v7
        id: get-pr
        with:
          script: |
            // Check if this is a workflow_dispatch event with inputs
            const eventName = context.eventName;
            let headBranch, headRepo, prNumber;

            if (eventName === 'issue_comment') {
              // Use outputs from /review validation step
              const valid = '${{ steps.review-command.outputs.valid }}';
              if (valid !== 'true') {
                console.log('issue_comment event but /review validation failed - no PR');
                core.setOutput('pr_number', '');
                core.setOutput('is_draft', 'false');
                return;
              }
              prNumber = parseInt('${{ steps.review-command.outputs.pr_number }}', 10);
              headBranch = '${{ steps.review-command.outputs.head_ref }}';
              headRepo = '${{ steps.review-command.outputs.head_repo }}';
              console.log(`Triggered via /review comment for PR #${prNumber}`);
            } else if (eventName === 'workflow_dispatch') {
              // Use inputs from workflow_dispatch
              headBranch = '${{ inputs.head_ref }}';
              headRepo = '${{ inputs.head_repo }}';
              prNumber = parseInt('${{ inputs.pr_number }}', 10);
              console.log(`Triggered via workflow_dispatch for PR #${prNumber}`);
            } else if (eventName === 'pull_request') {
              // Use data from pull_request event (triggered on reopen)
              const pr = context.payload.pull_request;
              headBranch = pr.head.ref;
              headRepo = pr.head.repo.full_name;
              prNumber = pr.number;
              console.log(`Triggered via pull_request event for PR #${prNumber}`);
            } else {
              // Use data from workflow_run event
              headBranch = context.payload.workflow_run.head_branch;
              headRepo = context.payload.workflow_run.head_repository.full_name;
              console.log(`Looking for PR with head branch: ${headBranch} from ${headRepo}`);
            }

            // Fetch PR details
            let pr;
            if (prNumber) {
              // Fetch specific PR by number
              const prResponse = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              pr = prResponse.data;
            } else {
              // Search for PR by head branch
              const prs = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                head: `${headRepo.split('/')[0]}:${headBranch}`
              });
              if (prs.data.length > 0) {
                pr = prs.data[0];
              }
            }

            if (pr) {
              console.log(`Found PR #${pr.number}: ${pr.title}`);
              console.log(`PR draft status: ${pr.draft}`);
              core.setOutput('pr_number', pr.number);
              core.setOutput('pr_title', pr.title);
              // Base64 encode PR body to avoid issues with special characters in env vars
              const prBodyB64 = Buffer.from(pr.body || '').toString('base64');
              core.setOutput('pr_body_b64', prBodyB64);
              core.setOutput('head_ref', pr.head.ref);
              core.setOutput('head_repo', pr.head.repo.full_name);
              core.setOutput('is_draft', pr.draft ? 'true' : 'false');
            } else {
              console.log('No open PR found for this workflow run');
              core.setOutput('pr_number', '');
              core.setOutput('is_draft', 'false');
            }

      - name: Extract linked issue from PR body
        if: steps.get-pr.outputs.pr_number != ''
        id: get-issue
        env:
          PR_BODY_B64: ${{ steps.get-pr.outputs.pr_body_b64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Decode PR body to search for linked issues
          PR_BODY=$(echo "$PR_BODY_B64" | base64 -d)

          # Parse PR body for "Resolves #X", "Fixes #X", "Closes #X" patterns
          ISSUE_NUM=$(echo "$PR_BODY" | grep -oP '(Resolves|Fixes|Closes|Fix)\s*#\K\d+' | head -1 || echo "")
          echo "issue_number=$ISSUE_NUM" >> $GITHUB_OUTPUT

          if [ -n "$ISSUE_NUM" ]; then
            echo "Found linked issue: #$ISSUE_NUM"
            # Fetch issue details
            ISSUE_JSON=$(gh api repos/${{ github.repository }}/issues/$ISSUE_NUM 2>/dev/null || echo "{}")
            ISSUE_TITLE=$(echo "$ISSUE_JSON" | jq -r '.title // ""')
            ISSUE_BODY=$(echo "$ISSUE_JSON" | jq -r '.body // ""')
            echo "issue_title=$ISSUE_TITLE" >> $GITHUB_OUTPUT
            # Base64 encode issue body to avoid issues with special characters
            echo "issue_body_b64=$(echo "$ISSUE_BODY" | base64 -w0)" >> $GITHUB_OUTPUT
          else
            echo "No linked issue found in PR body"
            echo "issue_title=" >> $GITHUB_OUTPUT
            echo "issue_body_b64=" >> $GITHUB_OUTPUT
          fi

      - name: Count fix attempts from PR labels
        if: steps.get-pr.outputs.pr_number != ''
        id: count-attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ steps.get-pr.outputs.pr_number }}"

          # Get all labels on the PR
          LABELS=$(gh api repos/${{ github.repository }}/issues/$PR_NUMBER/labels --jq '.[].name' 2>/dev/null || echo "")

          # Count ai-fix-attempt-N labels
          COUNT=0
          for label in $LABELS; do
            if [[ "$label" =~ ^ai-fix-attempt-[0-9]+$ ]]; then
              NUM=$(echo "$label" | grep -oP '\d+$')
              if [ "$NUM" -gt "$COUNT" ]; then
                COUNT=$NUM
              fi
            fi
          done

          echo "Current fix attempt count: $COUNT"
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Check if reviews already passed (or reset on reopen)
        if: steps.get-pr.outputs.pr_number != ''
        id: check-existing-reviews
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ steps.get-pr.outputs.pr_number }}"
          EVENT_NAME="${{ github.event_name }}"

          # If PR was reopened or /review command used, remove the reviews-passed label to allow re-review
          if [ "$EVENT_NAME" = "pull_request" ] && [ "${{ github.event.action }}" = "reopened" ]; then
            echo "PR was reopened - removing agent-reviews-passed label to allow re-review"
            gh pr edit $PR_NUMBER --remove-label "agent-reviews-passed" --repo ${{ github.repository }} 2>/dev/null || true
            echo "already_passed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$EVENT_NAME" = "issue_comment" ]; then
            echo "/review command used - removing agent-reviews-passed label to allow re-review"
            gh pr edit $PR_NUMBER --remove-label "agent-reviews-passed" --repo ${{ github.repository }} 2>/dev/null || true
            echo "already_passed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if agent-reviews-passed label exists
          LABELS=$(gh api repos/${{ github.repository }}/issues/$PR_NUMBER/labels --jq '.[].name' 2>/dev/null || echo "")

          if echo "$LABELS" | grep -q "^agent-reviews-passed$"; then
            echo "Agent reviews already passed for this PR - skipping review cycle"
            echo "already_passed=true" >> $GITHUB_OUTPUT
          else
            echo "No existing reviews found - will run full review cycle"
            echo "already_passed=false" >> $GITHUB_OUTPUT
          fi

      # SECURITY: Check if PR author is authorized to trigger AI reviews
      # This prevents prompt injection and code execution from external/untrusted users
      - name: Check PR author authorization
        if: steps.get-pr.outputs.pr_number != ''
        id: check-author-auth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ steps.get-pr.outputs.pr_number }}"

          # Fetch PR author association
          PR_DATA=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER)
          AUTHOR_ASSOC=$(echo "$PR_DATA" | jq -r '.author_association')
          AUTHOR_LOGIN=$(echo "$PR_DATA" | jq -r '.user.login')
          HEAD_REPO=$(echo "$PR_DATA" | jq -r '.head.repo.full_name')
          BASE_REPO=$(echo "$PR_DATA" | jq -r '.base.repo.full_name')

          echo "PR Author: $AUTHOR_LOGIN"
          echo "Author association: $AUTHOR_ASSOC"
          echo "Head repo: $HEAD_REPO"
          echo "Base repo: $BASE_REPO"

          # Check if this is a fork PR (external contribution)
          IS_FORK="false"
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            IS_FORK="true"
            echo "⚠️ This is a PR from a fork: $HEAD_REPO -> $BASE_REPO"
          fi

          # Allow: OWNER, MEMBER, COLLABORATOR
          # Deny: CONTRIBUTOR, FIRST_TIMER, FIRST_TIME_CONTRIBUTOR, MANNEQUIN, NONE
          case "$AUTHOR_ASSOC" in
            OWNER|MEMBER|COLLABORATOR)
              echo "✅ Authorized: $AUTHOR_LOGIN is a $AUTHOR_ASSOC"
              echo "authorized=true" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "❌ Not authorized: $AUTHOR_LOGIN is a $AUTHOR_ASSOC"
              echo "External users cannot trigger AI Code Review workflows."
              echo "This is a security measure to prevent prompt injection attacks."
              echo "authorized=false" >> $GITHUB_OUTPUT

              # Post a comment explaining why the review was skipped
              gh pr comment $PR_NUMBER --body "## AI Code Review Skipped

          This PR was opened by an external contributor ($AUTHOR_LOGIN with association: $AUTHOR_ASSOC).

          For security reasons, AI reviews are only enabled for repository collaborators, members, and owners. This prevents potential prompt injection attacks through PR descriptions or issue content.

          A repository maintainer will review this PR manually.

          ---
          This is an automated security notice." --repo ${{ github.repository }} 2>/dev/null || true
              ;;
          esac

      # Classify PR files to determine which reviews to run
      # Config-only PRs skip heavy code reviews (concurrency, code quality)
      - name: Classify PR files
        if: steps.get-pr.outputs.pr_number != ''
        id: classify-files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ steps.get-pr.outputs.pr_number }}"

          # Get list of changed files
          FILES=$(gh pr diff $PR_NUMBER --name-only --repo ${{ github.repository }})

          echo "Changed files:"
          echo "$FILES"

          # Initialize flags
          CONFIG_ONLY="true"
          HAS_GO_CODE="false"

          while IFS= read -r file; do
            # Skip empty lines
            [ -z "$file" ] && continue

            # Check for Go code
            if [[ "$file" == *.go ]]; then
              HAS_GO_CODE="true"
            fi

            # Check if file is outside configs/
            if [[ "$file" != configs/* ]]; then
              CONFIG_ONLY="false"
            fi
          done <<< "$FILES"

          echo "Classification:"
          echo "  config_only=$CONFIG_ONLY"
          echo "  has_go_code=$HAS_GO_CODE"

          echo "config_only=$CONFIG_ONLY" >> $GITHUB_OUTPUT
          echo "has_go_code=$HAS_GO_CODE" >> $GITHUB_OUTPUT

      # Generate cross-PR context digest for reviewers
      # Uses gh and git only (no AI tokens) to build a summary of recent project activity
      - name: Generate cross-PR context
        if: steps.get-pr.outputs.pr_number != ''
        id: generate-cross-pr-context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ steps.get-pr.outputs.pr_number }}"
          HEAD_REF="${{ steps.get-pr.outputs.head_ref }}"
          CONTEXT=""

          # Last 10 merged PR titles/summaries
          CONTEXT+="=== RECENTLY MERGED PRs ===\n"
          RECENT_PRS=$(gh pr list --state merged --limit 10 --json number,title,mergedAt \
            --jq '.[] | "#\(.number) (\(.mergedAt[:10])): \(.title)"' \
            --repo ${{ github.repository }} 2>/dev/null || echo "")
          if [ -n "$RECENT_PRS" ]; then
            CONTEXT+="$RECENT_PRS\n"
          else
            CONTEXT+="(none found)\n"
          fi

          # For each changed file, show recent PRs that also touched it
          CONTEXT+="\n=== RECENT CHANGES TO FILES IN THIS PR ===\n"
          FILES=$(gh pr diff $PR_NUMBER --name-only --repo ${{ github.repository }} 2>/dev/null || echo "")

          # Checkout needed for git log
          # Note: full checkout happens in downstream jobs; here we just need the log
          # Use the GitHub API instead to avoid needing a checkout
          for file in $FILES; do
            [ -z "$file" ] && continue
            # Get commits that touched this file in the last 30 days via API
            FILE_HISTORY=$(gh api "repos/${{ github.repository }}/commits?path=${file}&since=$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%SZ)&per_page=5" \
              --jq '.[] | "\(.sha[:7]) \(.commit.message | split("\n")[0])"' 2>/dev/null || echo "")
            if [ -n "$FILE_HISTORY" ]; then
              CONTEXT+="$file:\n$FILE_HISTORY\n"
            fi
          done

          # Diff stats for this PR
          CONTEXT+="\n=== THIS PR DIFF STATS ===\n"
          DIFF_STATS=$(gh pr diff $PR_NUMBER --repo ${{ github.repository }} 2>/dev/null | diffstat 2>/dev/null || \
            gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq '"additions: \(.additions), deletions: \(.deletions), changed_files: \(.changed_files)"' 2>/dev/null || echo "")
          CONTEXT+="$DIFF_STATS\n"

          # Base64 encode and cap at 15KB
          ENCODED=$(printf '%b' "$CONTEXT" | head -c 15000 | base64 -w 0)
          echo "cross_pr_context_b64=$ENCODED" >> $GITHUB_OUTPUT

  # Build and cache devcontainer image
  # SECURITY: Always build from main branch, NEVER from PR branches
  # This prevents malicious Dockerfile modifications from being used to build the container
  # SKIP for draft PRs (no reviews or fixes will run)
  # Optimization: Skip build if .devcontainer/ files haven't changed and image exists
  # Fix test failures - runs in a retry loop until tests pass (max 3 attempts)
  # Skips draft PRs to support TDD workflows where tests are intentionally failing
  fix-test-failures:
    needs: get-context
    if: |
      needs.get-context.outputs.pr_number != '' &&
      needs.get-context.outputs.is_draft != 'true' &&
      needs.get-context.outputs.reviews_already_passed != 'true' &&
      needs.get-context.outputs.author_authorized == 'true' &&
      needs.get-context.outputs.tests_passed == 'false' &&
      needs.get-context.outputs.fix_attempts < 3
    runs-on: [self-hosted, homelab]
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      packages: read
      actions: write  # Required to trigger PR Tests workflow via workflow_dispatch
      statuses: write  # Required to create commit status after tests pass

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.get-context.outputs.head_ref }}
          repository: ${{ needs.get-context.outputs.head_repo }}
          fetch-depth: 0
          token: ${{ github.token }}  # Read-only: parallel reviewers must not push

      - name: Increment fix attempt counter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ needs.get-context.outputs.pr_number }}"
          CURRENT_ATTEMPTS="${{ needs.get-context.outputs.fix_attempts }}"
          NEXT_ATTEMPT=$((CURRENT_ATTEMPTS + 1))

          # Create the label if it doesn't exist
          gh label create "ai-fix-attempt-$NEXT_ATTEMPT" \
            --color "ff9500" \
            --description "AI fix attempt $NEXT_ATTEMPT" \
            --repo ${{ github.repository }} 2>/dev/null || true

          # Add the label to the PR
          gh pr edit $PR_NUMBER --add-label "ai-fix-attempt-$NEXT_ATTEMPT" --repo ${{ github.repository }}

          echo "Marked as fix attempt $NEXT_ATTEMPT"

      - name: Configure git identity for commits
        run: |
          git config user.name "claude[bot]"
          git config user.email "claude[bot]@users.noreply.github.com"

      - name: Run AI to fix test failures
        id: ai-fix
        uses: ./.github/actions/run-ci-agent
        with:
          image: ${{ env.CI_IMAGE }}
          prompt_file: .github/ci/prompts/fix-test-failures.md
          output_file: /tmp/fix-failures-output/fix-failures-output.jsonl
          env: |
            AI_API_KEY=${{ vars.AI_API_KEY }}
            GH_TOKEN=${{ secrets.WORKFLOW_PAT }}
            PR_NUMBER=${{ needs.get-context.outputs.pr_number }}
            PR_TITLE=${{ needs.get-context.outputs.pr_title }}
            PR_BODY_B64=${{ needs.get-context.outputs.pr_body_b64 }}
            ISSUE_NUMBER=${{ needs.get-context.outputs.issue_number }}
            ISSUE_TITLE=${{ needs.get-context.outputs.issue_title }}
            ISSUE_BODY_B64=${{ needs.get-context.outputs.issue_body_b64 }}
            RUN_ID=${{ needs.get-context.outputs.run_id }}
            ATTEMPT_NUM=${{ needs.get-context.outputs.fix_attempts }}
            REPO=${{ github.repository }}
            TRIGGERING_SHA=${{ needs.get-context.outputs.triggering_sha }}
            HEAD_REF=${{ needs.get-context.outputs.head_ref }}
          pre_script: |
            # Actual attempt number (current + 1)
            ATTEMPT=$((ATTEMPT_NUM + 1))
            # Decode base64-encoded bodies (handles special characters safely)
            PR_BODY=$(echo "$PR_BODY_B64" | base64 -d 2>/dev/null || echo "")
            ISSUE_BODY=$(echo "$ISSUE_BODY_B64" | base64 -d 2>/dev/null || echo "")
            export ATTEMPT PR_BODY ISSUE_BODY

      - name: Trigger PR Tests and reviews after fix
        if: success()
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          FIX_ATTEMPTS: ${{ needs.get-context.outputs.fix_attempts }}
        run: |
          # Check if new commits were pushed by comparing current HEAD to triggering SHA
          git fetch origin ${{ needs.get-context.outputs.head_ref }}
          CURRENT_HEAD=$(git rev-parse origin/${{ needs.get-context.outputs.head_ref }})
          TRIGGERING_SHA="${{ needs.get-context.outputs.triggering_sha }}"

          if [ "$CURRENT_HEAD" != "$TRIGGERING_SHA" ]; then
            echo "Fix was pushed (HEAD changed from $TRIGGERING_SHA to $CURRENT_HEAD)"
            echo "Triggering PR Tests workflow..."

            # Trigger PR Tests and capture the run
            gh workflow run "PR Tests" --ref "${{ needs.get-context.outputs.head_ref }}" --repo ${{ github.repository }}
            echo "PR Tests workflow triggered, waiting for it to start..."
            sleep 10

            # Find the run we just triggered
            RUN_ID=$(gh run list --workflow="pr-tests.yml" --branch="${{ needs.get-context.outputs.head_ref }}" --limit=1 --json databaseId --jq '.[0].databaseId')
            echo "Found PR Tests run: $RUN_ID"

            # Poll for completion (max 15 minutes)
            MAX_WAIT=900
            ELAPSED=0
            POLL_INTERVAL=30

            while [ $ELAPSED -lt $MAX_WAIT ]; do
              STATUS=$(gh run view $RUN_ID --json status,conclusion --jq '.status')
              if [ "$STATUS" = "completed" ]; then
                CONCLUSION=$(gh run view $RUN_ID --json conclusion --jq '.conclusion')
                echo "PR Tests completed with conclusion: $CONCLUSION"
                break
              fi
              echo "PR Tests still running... (waited ${ELAPSED}s)"
              sleep $POLL_INTERVAL
              ELAPSED=$((ELAPSED + POLL_INTERVAL))
            done

            if [ $ELAPSED -ge $MAX_WAIT ]; then
              echo "Timed out waiting for PR Tests - reviews will not run automatically"
              exit 0
            fi

            # If tests passed, create a commit status and trigger reviews
            # (workflow_run events don't fire for workflow_dispatch-triggered runs)
            if [ "$CONCLUSION" = "success" ]; then
              echo "Tests passed!"

              # Create a commit status for the PR's head SHA so the PR check shows as passed
              # This is needed because workflow_dispatch runs don't automatically create PR status checks
              echo "Creating commit status for $CURRENT_HEAD..."
              gh api repos/${{ github.repository }}/statuses/$CURRENT_HEAD \
                -f state="success" \
                -f target_url="https://github.com/${{ github.repository }}/actions/runs/$RUN_ID" \
                -f description="All required tests passed (via automated fix)" \
                -f context="All Required Tests"
              echo "Commit status created successfully"

              echo "Triggering AI Code Review..."
              gh workflow run "AI Code Review" \
                --ref "main" \
                --repo ${{ github.repository }} \
                -f head_ref="${{ needs.get-context.outputs.head_ref }}" \
                -f head_repo="${{ needs.get-context.outputs.head_repo }}" \
                -f pr_number="${{ needs.get-context.outputs.pr_number }}" \
                -f tests_passed="true" \
                -f run_id="$RUN_ID"
              echo "AI Code Review workflow triggered successfully"
            else
              echo "Tests still failing after fix attempt"

              # Trigger another AI Code Review run to retry the fix
              # This is necessary because workflow_run events don't fire for
              # workflow_dispatch-triggered runs, so we must manually trigger
              NEXT_ATTEMPT=$((FIX_ATTEMPTS + 1))
              if [ "$NEXT_ATTEMPT" -lt 3 ]; then
                echo "Triggering fix attempt $((NEXT_ATTEMPT + 1))/3..."
                gh workflow run "AI Code Review" \
                  --ref "main" \
                  --repo ${{ github.repository }} \
                  -f head_ref="${{ needs.get-context.outputs.head_ref }}" \
                  -f head_repo="${{ needs.get-context.outputs.head_repo }}" \
                  -f pr_number="${{ needs.get-context.outputs.pr_number }}" \
                  -f tests_passed="false" \
                  -f run_id="$RUN_ID"
                echo "Next fix attempt triggered"
              else
                echo "Max fix attempts (3) reached - human intervention required"
                COMMENT_BODY="## ❌ Automated Fix Failed"
                COMMENT_BODY="$COMMENT_BODY"$'\n\n'"All 3 automated fix attempts were unsuccessful. Human intervention is required."
                COMMENT_BODY="$COMMENT_BODY"$'\n\n'"**Recent Test Run:** https://github.com/${{ github.repository }}/actions/runs/$RUN_ID"
                COMMENT_BODY="$COMMENT_BODY"$'\n\n'"🤖 Generated by AI Code Review workflow"
                gh pr comment ${{ needs.get-context.outputs.pr_number }} --body "$COMMENT_BODY"
              fi
            fi
          else
            echo "No new commits - AI may have aborted or found no fix needed"
          fi

      - name: Upload fix attempt output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fix-failures-output-attempt-${{ needs.get-context.outputs.fix_attempts }}
          path: /tmp/fix-failures-output/fix-failures-output.jsonl
          retention-days: 7

  # AI review (code review) - runs after design-review
  # SKIP for config-only PRs (no code to review)
  # SKIP for draft PRs (work in progress)
  ai-review:
    needs: get-context
    if: |
      needs.get-context.outputs.pr_number != '' &&
      needs.get-context.outputs.is_draft != 'true' &&
      needs.get-context.outputs.reviews_already_passed != 'true' &&
      needs.get-context.outputs.author_authorized == 'true' &&
      needs.get-context.outputs.tests_passed == 'true' &&
      needs.get-context.outputs.config_only != 'true'
    runs-on: [self-hosted, homelab]
    timeout-minutes: 30
    permissions:
      contents: read  # Read-only: parallel reviewers only comment, merge-decision pushes fixes
      pull-requests: write
      issues: write
      id-token: write
      packages: read

    steps:
      - name: Verify tests passed on current commit
        id: verify-tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get the current HEAD SHA of the PR
          HEAD_SHA=$(gh api repos/${{ github.repository }}/pulls/${{ needs.get-context.outputs.pr_number }} --jq '.head.sha')
          echo "Checking test status for commit $HEAD_SHA"

          # Retry loop - check run may not be visible immediately after workflow triggers
          MAX_ATTEMPTS=40
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            STATUS=$(gh api repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs --jq '[.check_runs[] | select(.name == "All Required Tests")] | sort_by(.completed_at) | last | .conclusion' 2>/dev/null || echo "")

            if [ "$STATUS" = "success" ]; then
              echo "✅ All Required Tests passed on current commit"
              echo "verified=true" >> $GITHUB_OUTPUT
              exit 0
            fi

            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Check run not found yet (status: ${STATUS:-not found}), waiting 10s..."
              sleep 10
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "⚠️ Tests have not passed on current commit after $MAX_ATTEMPTS attempts (status: ${STATUS:-not found})"
          echo "Skipping review - tests must pass first"
          echo "verified=false" >> $GITHUB_OUTPUT

