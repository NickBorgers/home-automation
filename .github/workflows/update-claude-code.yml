name: Update Codex CLI Version

on:
  schedule:
    # Weekly on Mondays at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-codex-cli:
    runs-on: [self-hosted, homelab]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check for Codex CLI update
        id: check
        run: |
          CURRENT=$(grep -oP 'ARG CODEX_CLI_VERSION=\K[0-9.]+' .devcontainer/Dockerfile)
          LATEST=$(npm view @openai/codex version)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" != "$LATEST" ]; then
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Current: $CURRENT, Latest: $LATEST"

      - name: Update Dockerfile
        if: steps.check.outputs.needs_update == 'true'
        run: |
          sed -i "s/ARG CODEX_CLI_VERSION=.*/ARG CODEX_CLI_VERSION=${{ steps.check.outputs.latest }}/" .devcontainer/Dockerfile

      - name: Create Pull Request
        if: steps.check.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          # PAT required so the created PR triggers pull_request events (GITHUB_TOKEN suppresses them)
          token: ${{ secrets.WORKFLOW_PAT }}
          commit-message: "chore: Update Codex CLI to ${{ steps.check.outputs.latest }}"
          title: "chore: Update Codex CLI ${{ steps.check.outputs.current }} → ${{ steps.check.outputs.latest }}"
          body: |
            Automated weekly update of Codex CLI version.

            - **Current:** ${{ steps.check.outputs.current }}
            - **Latest:** ${{ steps.check.outputs.latest }}
            - **Changelog:** https://www.npmjs.com/package/@openai/codex?activeTab=versions

            🤖 Generated automatically by the `update-codex-cli` workflow.
          branch: chore/update-codex-cli
          delete-branch: true
