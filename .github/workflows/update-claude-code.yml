name: Update Claude Code Version

on:
  schedule:
    # Weekly on Mondays at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-claude-code:
    runs-on: [self-hosted, homelab]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check for Claude Code update
        id: check
        run: |
          CURRENT=$(grep -oP 'ARG CLAUDE_CODE_VERSION=\K[0-9.]+' .devcontainer/Dockerfile)
          LATEST=$(npm view @anthropic-ai/claude-code version)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$CURRENT" != "$LATEST" ]; then
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Current: $CURRENT, Latest: $LATEST"

      - name: Update Dockerfile
        if: steps.check.outputs.needs_update == 'true'
        run: |
          sed -i "s/ARG CLAUDE_CODE_VERSION=.*/ARG CLAUDE_CODE_VERSION=${{ steps.check.outputs.latest }}/" .devcontainer/Dockerfile

      - name: Create Pull Request
        if: steps.check.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: Update Claude Code to ${{ steps.check.outputs.latest }}"
          title: "chore: Update Claude Code ${{ steps.check.outputs.current }} → ${{ steps.check.outputs.latest }}"
          body: |
            Automated weekly update of Claude Code CLI version.

            - **Current:** ${{ steps.check.outputs.current }}
            - **Latest:** ${{ steps.check.outputs.latest }}
            - **Changelog:** https://www.npmjs.com/package/@anthropic-ai/claude-code?activeTab=versions

            🤖 Generated automatically by the `update-claude-code` workflow.
          branch: chore/update-claude-code
          delete-branch: true
