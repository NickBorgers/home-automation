name: AI Diagnose Workflow Failure

# Triggers when any workflow run completes with failure
# Analyzes if it's a GitHub Actions configuration problem vs a test/code failure
# or transient infrastructure issue (external service availability problems)
# Creates an issue only for Actions configuration problems
# (not test failures or transient infrastructure issues)

# SECURITY NOTE: This workflow has lower prompt injection risk because:
# - It only triggers on workflow_run events (not user-controlled events)
# - It analyzes workflow logs and YAML files, not user-provided content
# - The AI prompt is constructed from workflow metadata, not PR/issue content
# - It only has read permissions for contents/actions, write only for issues
#
# However, malicious workflow log output could theoretically influence the AI's analysis.
# This is an acceptable risk since the worst case is creating an unnecessary issue.

on:
  workflow_run:
    workflows:
      - "PR Tests"
      - "Build and Push Docker Image"
      - "Publish-Screenshots"
      - "Trigger Private Security Rebuild"
      - "Notify Private Repo of PR Merge"
      - "AI Assistant"
      - "AI Code Review"
    types:
      - completed

# Prevent duplicate diagnoses for the same workflow run
concurrency:
  group: diagnose-failure-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

env:
  CI_IMAGE: ghcr.io/nickborgers/home-automation-ci:latest

jobs:
  # Only proceed if the workflow failed
  check-failure:
    runs-on: [self-hosted, homelab]
    outputs:
      should_diagnose: ${{ steps.check.outputs.should_diagnose }}
      workflow_name: ${{ github.event.workflow_run.name }}
      run_id: ${{ github.event.workflow_run.id }}
      run_url: ${{ github.event.workflow_run.html_url }}
      head_branch: ${{ github.event.workflow_run.head_branch }}
      head_sha: ${{ github.event.workflow_run.head_sha }}
      conclusion: ${{ github.event.workflow_run.conclusion }}
    steps:
      - name: Check if diagnosis is needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          WORKFLOW_NAME="${{ github.event.workflow_run.name }}"
          RUN_ID="${{ github.event.workflow_run.id }}"

          echo "Workflow: $WORKFLOW_NAME"
          echo "Conclusion: $CONCLUSION"
          echo "Run ID: $RUN_ID"

          # Only diagnose failures (not success, cancelled, or skipped)
          if [ "$CONCLUSION" != "failure" ]; then
            echo "Workflow did not fail (conclusion: $CONCLUSION) - skipping diagnosis"
            echo "should_diagnose=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Skip diagnosis for THIS workflow only to avoid infinite loops
          # Other AI workflows (AI Assistant, AI Code Review) should be diagnosed
          if [[ "$WORKFLOW_NAME" == "AI Diagnose Workflow Failure" ]]; then
            echo "Skipping diagnosis of diagnosis workflow to prevent infinite loops"
            echo "should_diagnose=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if an issue already exists for this workflow run
          EXISTING_ISSUE=$(gh issue list \
            --repo ${{ github.repository }} \
            --search "Workflow Failure: $WORKFLOW_NAME run #$RUN_ID" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$EXISTING_ISSUE" ]; then
            echo "Issue #$EXISTING_ISSUE already exists for this run - skipping"
            echo "should_diagnose=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "should_diagnose=true" >> $GITHUB_OUTPUT

  # Run AI assistant to diagnose the failure
  diagnose-failure:
    needs: check-failure
    if: needs.check-failure.outputs.should_diagnose == 'true'
    runs-on: [self-hosted, homelab]
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      actions: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull CI image
        run: docker pull "${CI_IMAGE}"

      - name: Diagnose failure with AI assistant
        env:
          AI_API_KEY: ${{ vars.AI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ needs.check-failure.outputs.workflow_name }}
          RUN_ID: ${{ needs.check-failure.outputs.run_id }}
          RUN_URL: ${{ needs.check-failure.outputs.run_url }}
          HEAD_BRANCH: ${{ needs.check-failure.outputs.head_branch }}
          HEAD_SHA: ${{ needs.check-failure.outputs.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          OUTPUT_DIR="${{ runner.temp }}/diagnose-output"
          mkdir -p "$OUTPUT_DIR"

          # Run the agent inside the CI image. The prompt lives in the repo
          # at .github/ci/prompts/diagnose-workflow-failure.md and uses shell
          # variable references (${WORKFLOW_NAME}, etc.) so run-ai.sh can
          # expand them at invocation time via `envsubst` before passing to
          # the model.
          docker run --rm \
            --network host \
            --workdir /workspace \
            -v "${{ github.workspace }}:/workspace" \
            -v "$OUTPUT_DIR:/tmp/diagnose-output" \
            -e AI_API_KEY \
            -e GH_TOKEN \
            -e WORKFLOW_NAME \
            -e RUN_ID \
            -e RUN_URL \
            -e HEAD_BRANCH \
            -e HEAD_SHA \
            -e REPO \
            "${CI_IMAGE}" \
            -lc '
              set -euo pipefail
              source .devcontainer/configure-ai.sh

              # envsubst substitutes ${WORKFLOW_NAME}, ${RUN_ID}, etc. from the
              # environment. It leaves $(cat <<…) command substitutions alone
              # because it only recognizes $VAR / ${VAR} patterns.
              PROMPT=$(envsubst < .github/ci/prompts/diagnose-workflow-failure.md)
              bash .devcontainer/run-ai.sh "$PROMPT" 2>&1 \
                | tee /tmp/diagnose-output/diagnose-output.jsonl
            '

      - name: Upload diagnosis output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workflow-diagnosis-output
          path: ${{ runner.temp }}/diagnose-output/diagnose-output.jsonl
          retention-days: 7
