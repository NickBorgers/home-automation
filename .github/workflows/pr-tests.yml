name: PR Tests

on:
  pull_request:
    branches:
      - main
      - master
      - '**'
  push:
    branches:
      - 'claude/**'  # Only test development branches; main/master tested in docker-build-push.yml
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to test (branch name or SHA)'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for code changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'homeautomation-go/**'
              - 'configs/**'
              - '.github/workflows/**'
            docker:
              - 'homeautomation-go/Dockerfile'
              - 'homeautomation-go/go.mod'
              - 'homeautomation-go/go.sum'
              - 'homeautomation-go/**/*.go'
              - 'configs/**'

  style-checks:
    name: Go Style & Linting
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: homeautomation-go/go.sum

      - name: Cache Go tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-${{ hashFiles('homeautomation-go/go.mod') }}-v1

      - name: Run style checks
        run: make ci-style-checks

  unit-tests:
    name: Unit Tests (Required for PR Merge)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: homeautomation-go/go.sum

      - name: Download dependencies
        run: cd homeautomation-go && go mod download

      - name: Run unit tests with coverage
        run: make ci-unit-tests

  integration-tests:
    name: Integration Tests (Required for PR Merge)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: homeautomation-go/go.sum

      - name: Download dependencies
        run: cd homeautomation-go && go mod download

      - name: Run integration tests
        run: make ci-integration-tests

  config-tests:
    name: Config Validation Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Music YAML
        run: make run-yamllint-music

      - name: Validate Hue YAML
        run: make run-yamllint-hue

      - name: Validate Spotify URIs
        run: make run-spotify-validation-music

      - name: Config Test Summary
        if: always()
        run: |
          echo "==============================================="
          echo "        CONFIG VALIDATION SUMMARY"
          echo "==============================================="
          echo "✅ Music YAML validation passed"
          echo "✅ Hue YAML validation passed"
          echo "✅ Spotify URI validation passed"
          echo ""
          echo "✅ ALL CONFIG TESTS PASSED"
          echo "==============================================="

  diagram-validation:
    name: Generated Diagram Validation
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: homeautomation-go/go.sum

      - name: Validate generated diagrams
        run: make validate-diagrams

      - name: Diagram Validation Summary
        if: always()
        run: |
          echo "==============================================="
          echo "     GENERATED DIAGRAM VALIDATION SUMMARY"
          echo "==============================================="
          echo "✅ Plugin dependency diagrams are up-to-date"
          echo "✅ State variable matrix is up-to-date"
          echo ""
          echo "✅ DIAGRAM VALIDATION PASSED"
          echo "==============================================="

  docker-build:
    name: Docker Build Validation
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker build with repository root context
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./homeautomation-go/Dockerfile
          tags: homeautomation-test:pr
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify config files are accessible in image
        run: |
          echo "Verifying config files are accessible in the image..."
          # Check that config files exist in the image at /app/configs
          docker run --rm homeautomation-test:pr ls -la /app/configs/

          # Verify specific config files are present
          docker run --rm homeautomation-test:pr sh -c '
            test -f /app/configs/energy_config.yaml && \
            test -f /app/configs/music_config.yaml && \
            test -f /app/configs/hue_config.yaml && \
            test -f /app/configs/schedule_config.yaml && \
            echo "✅ All config files present in image"
          '
          echo "✅ Docker image builds and can access configuration paths"

      - name: Container startup smoke test (DEV_MODE)
        run: |
          echo "🚀 Running container startup smoke test..."

          # Start container in DEV_MODE (uses mock HA server)
          # This catches any panics during initialization (e.g., issue #237)
          docker run -d --name smoke-test \
            -e DEV_MODE=true \
            -p 8080:8080 \
            homeautomation-test:pr

          # Wait for container to either become healthy or crash
          echo "Waiting for container to start (max 30 seconds)..."
          for i in $(seq 1 30); do
            # Check if container is still running
            if ! docker ps -q --filter "name=smoke-test" | grep -q .; then
              echo "❌ Container exited unexpectedly!"
              echo ""
              echo "Container logs:"
              docker logs smoke-test
              docker rm smoke-test || true
              exit 1
            fi

            # Check if health endpoint responds
            if curl -sf http://localhost:8080/health >/dev/null 2>&1; then
              echo "✅ Container started successfully (health check passed)"
              break
            fi

            if [ $i -eq 30 ]; then
              echo "❌ Container failed to become healthy within 30 seconds"
              echo ""
              echo "Container logs:"
              docker logs smoke-test
              docker stop smoke-test || true
              docker rm smoke-test || true
              exit 1
            fi

            sleep 1
          done

          # Additional verification: check dashboard endpoint
          if curl -sf http://localhost:8080/dashboard >/dev/null 2>&1; then
            echo "✅ Dashboard endpoint responding"
          else
            echo "⚠️  Dashboard endpoint not responding (non-fatal)"
          fi

          # Check shadow API returns valid JSON
          if curl -sf http://localhost:8080/api/shadow | jq . >/dev/null 2>&1; then
            echo "✅ Shadow API returns valid JSON"
          else
            echo "⚠️  Shadow API not returning valid JSON (non-fatal)"
          fi

          # Cleanup
          docker stop smoke-test
          docker rm smoke-test
          echo "✅ Container smoke test passed"

      - name: Docker Build Summary
        if: always()
        run: |
          echo "==============================================="
          echo "        DOCKER BUILD VALIDATION SUMMARY"
          echo "==============================================="
          echo "✅ Docker image builds successfully"
          echo "✅ Config files accessible in container"
          echo "✅ Build context correctly set to repository root"
          echo "✅ Container starts without panic (smoke test)"
          echo "✅ Health endpoint responds"
          echo ""
          echo "✅ DOCKER BUILD VALIDATION PASSED"
          echo "==============================================="

  all-tests-passed:
    name: All Required Tests
    runs-on: ubuntu-latest
    needs: [changes, style-checks, unit-tests, integration-tests, config-tests, diagram-validation, docker-build]
    if: always()

    steps:
      - name: Check test results
        run: |
          # A job is considered passed if it succeeded OR was skipped (due to path filtering)
          check_result() {
            local result=$1
            [[ "$result" == "success" || "$result" == "skipped" ]]
          }

          failed=false

          if ! check_result "${{ needs.style-checks.result }}"; then
            echo "❌ Style Checks: ${{ needs.style-checks.result }}"
            failed=true
          fi
          if ! check_result "${{ needs.unit-tests.result }}"; then
            echo "❌ Unit Tests: ${{ needs.unit-tests.result }}"
            failed=true
          fi
          if ! check_result "${{ needs.integration-tests.result }}"; then
            echo "❌ Integration Tests: ${{ needs.integration-tests.result }}"
            failed=true
          fi
          if ! check_result "${{ needs.config-tests.result }}"; then
            echo "❌ Config Tests: ${{ needs.config-tests.result }}"
            failed=true
          fi
          if ! check_result "${{ needs.diagram-validation.result }}"; then
            echo "❌ Diagram Validation: ${{ needs.diagram-validation.result }}"
            failed=true
          fi
          if ! check_result "${{ needs.docker-build.result }}"; then
            echo "❌ Docker Build: ${{ needs.docker-build.result }}"
            failed=true
          fi

          if [ "$failed" = true ]; then
            echo ""
            echo "❌ Some required tests failed"
            exit 1
          fi

          echo "✅ All required tests passed - PR is ready to merge"
          echo ""
          echo "Job Results:"
          echo "  Style Checks: ${{ needs.style-checks.result }}"
          echo "  Unit Tests: ${{ needs.unit-tests.result }}"
          echo "  Integration Tests: ${{ needs.integration-tests.result }}"
          echo "  Config Tests: ${{ needs.config-tests.result }}"
          echo "  Diagram Validation: ${{ needs.diagram-validation.result }}"
          echo "  Docker Build: ${{ needs.docker-build.result }}"
