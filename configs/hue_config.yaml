---
rooms:
  - hue_group: Living Room
    hass_area_id: living_room_2
    conditions:
      # Priority 0: TV playing -> skip (Hue Sync controls the lights)
      # When Hue Sync is active, don't override with scene activation
      - action: skip
        variable: isTVPlaying
        value: true
      # Priority 1: No one home -> OFF
      - action: off
        variable: isAnyoneHomeAndAwake
        value: false
      # Priority 2: Someone home and awake -> ON
      - action: on
        variable: isAnyoneHomeAndAwake
        value: true
      # Priority 3: TV not playing -> ON (for ambient lighting)
      - action: on
        variable: isTVPlaying
        value: false
    increase_brightness_if_true: isHaveGuests
    transition_seconds: 30

  - hue_group: Primary Suite
    hass_area_id: master_bedroom
    conditions:
      # CRITICAL: isWakeSequenceActive and isMasterAsleep MUST be checked
      # BEFORE isAnyoneHomeAndAwake!
      #
      # BUG FIX (2026-02-24 production incident):
      # During wake sequence, sleephygiene controls the bedroom lights with
      # a slow fade-in. The lighting plugin must completely hands-off during
      # wake sequence to avoid interfering with the fade-in.
      #
      # Similarly, when master is asleep (but not wake sequence), the lighting
      # plugin should not control the bedroom lights. Sleephygiene manages
      # sleep state lighting.
      #
      # Priority 1: Wake sequence in progress -> yield to sleephygiene
      # This takes absolute priority to prevent interference with wake sequence
      - action: skip
        variable: isWakeSequenceActive
        value: true
      # Priority 2: Sleep prep active -> yield (bedtime initiated, waiting for sleep detection)
      - action: skip
        variable: isSleepPrepActive
        value: true
      # Priority 3: Master asleep -> yield to sleephygiene
      # Bedroom is in sleep mode, don't interfere
      - action: skip
        variable: isMasterAsleep
        value: true
      # Priority 4: No one home and awake -> OFF
      - action: off
        variable: isAnyoneHomeAndAwake
        value: false
      # Priority 5: Master not asleep -> ON
      - action: on
        variable: isMasterAsleep
        value: false
    increase_brightness_if_true: ~
    transition_seconds: 180

  - hue_group: Sitting Room
    hass_area_id: dining_room
    conditions:
      # Priority 1: No one home -> OFF
      - action: off
        variable: isAnyoneHomeAndAwake
        value: false
      # Priority 2: Someone home and awake -> ON
      - action: on
        variable: isAnyoneHomeAndAwake
        value: true
    increase_brightness_if_true: ~
    transition_seconds: 120

  - hue_group: Front of House
    hass_area_id: front_of_house
    conditions:
      # Priority 0: Front of house person present -> ON
      - action: on
        variable: isFrontOfHousePersonPresent
        value: true
      # Priority 1: Owner just returned -> ON (avoids race)
      - action: on
        variable: didOwnerJustReturnHome
        value: true
      # Priority 2: Guests present -> ON
      - action: on
        variable: isHaveGuests
        value: true
      # Priority 3: Everyone asleep or gone -> OFF
      - action: off
        variable: isAnyoneHomeAndAwake
        value: false
      # Priority 4-6: No presence indicators -> OFF
      - action: off
        variable: isHaveGuests
        value: false
      - action: off
        variable: didOwnerJustReturnHome
        value: false
      - action: off
        variable: isFrontOfHousePersonPresent
        value: false
    increase_brightness_if_true: ~
    transition_seconds: 15

  - hue_group: Decorative Outdoor Lights
    hass_area_id: front_of_house
    conditions:
      # Priority 0: Front of house person present -> ON
      - action: on
        variable: isFrontOfHousePersonPresent
        value: true
      # Priority 1: Owner just returned -> ON (avoids race)
      - action: on
        variable: didOwnerJustReturnHome
        value: true
      # Priority 2: Guests present -> ON
      - action: on
        variable: isHaveGuests
        value: true
      # Priority 3: Everyone asleep or gone -> OFF
      - action: off
        variable: isAnyoneHomeAndAwake
        value: false
      # Priority 4-6: No presence indicators -> OFF
      - action: off
        variable: isHaveGuests
        value: false
      - action: off
        variable: didOwnerJustReturnHome
        value: false
      - action: off
        variable: isFrontOfHousePersonPresent
        value: false
    increase_brightness_if_true: ~
    transition_seconds: ~

  - hue_group: N Office
    hass_area_id: n_office
    conditions:
      # Priority 1: Office not occupied -> OFF
      - action: off
        variable: isNickOfficeOccupied
        value: false
      # Priority 2: Office occupied -> ON
      - action: on
        variable: isNickOfficeOccupied
        value: true
    increase_brightness_if_true: ~
    transition_seconds: 2

  - hue_group: Kitchen
    hass_area_id: kitchen
    conditions:
      # Priority 1: No one home and awake -> OFF
      - action: off
        variable: isAnyoneHomeAndAwake
        value: false
      # Priority 2: Kitchen occupied -> ON
      - action: on
        variable: isKitchenOccupied
        value: true
    increase_brightness_if_true: ~
    transition_seconds: 5
    # The kitchen mmWave radar (Apollo MTR) is unreliable for stationary people:
    # it briefly drops detection then re-detects. Without this flag, every
    # re-detection re-activates the scene and overrides any manual brightness
    # the user dialed in. Edge-trigger so on→on reactivations are skipped.
    skip_reactivation_when_on: true

  - hue_group: C Office
    hass_area_id: c_office
    conditions:
      # Priority 1: No one home and awake -> OFF
      - action: off
        variable: isAnyoneHomeAndAwake
        value: false
    increase_brightness_if_true: ~
    transition_seconds: 2
