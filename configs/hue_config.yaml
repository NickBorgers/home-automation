---
rooms:
  - hue_group: Living Room
    hass_area_id: living_room_2
    conditions:
      # Priority 1: No one home -> OFF
      - action: off
        variable: isAnyoneHomeAndAwake
        value: false
      # Priority 2: Someone home and awake -> ON
      - action: on
        variable: isAnyoneHomeAndAwake
        value: true
      # Priority 3: TV not playing -> ON (for ambient lighting)
      - action: on
        variable: isTVPlaying
        value: false
    increase_brightness_if_true: isHaveGuests
    transition_seconds: 30

  - hue_group: Primary Suite
    hass_area_id: master_bedroom
    conditions:
      # Priority 1: No one home -> OFF
      - action: off
        variable: isAnyoneHomeAndAwake
        value: false
      # Priority 2: Wake sequence in progress -> yield to sleephygiene
      # Prevents lighting plugin from turning off lights during morning
      # wake-up fade-in while isMasterAsleep is still true.
      - action: on
        variable: isWakeSequenceActive
        value: true
      # Priority 3: Master asleep -> OFF
      - action: off
        variable: isMasterAsleep
        value: true
      # Priority 4: Master not asleep -> ON
      - action: on
        variable: isMasterAsleep
        value: false
    increase_brightness_if_true: ~
    transition_seconds: 180

  - hue_group: Sitting Room
    hass_area_id: dining_room
    conditions:
      # Priority 1: No one home -> OFF
      - action: off
        variable: isAnyoneHomeAndAwake
        value: false
      # Priority 2: Someone home and awake -> ON
      - action: on
        variable: isAnyoneHomeAndAwake
        value: true
    increase_brightness_if_true: ~
    transition_seconds: 120

  - hue_group: Front of House
    hass_area_id: front_of_house
    conditions:
      # Priority 0: Front of house person present -> ON
      - action: on
        variable: isFrontOfHousePersonPresent
        value: true
      # Priority 1: Everyone asleep or gone -> OFF
      - action: off
        variable: isAnyoneHomeAndAwake
        value: false
      # Priority 2-4: Any presence indicator -> ON
      - action: on
        variable: isHaveGuests
        value: true
      - action: on
        variable: didOwnerJustReturnHome
        value: true
      # Priority 5-7: No presence indicators -> OFF
      - action: off
        variable: isHaveGuests
        value: false
      - action: off
        variable: didOwnerJustReturnHome
        value: false
      - action: off
        variable: isFrontOfHousePersonPresent
        value: false
    increase_brightness_if_true: ~
    transition_seconds: 15

  - hue_group: Decorative Outdoor Lights
    hass_area_id: front_of_house
    conditions:
      # Priority 0: Front of house person present -> ON
      - action: on
        variable: isFrontOfHousePersonPresent
        value: true
      # Priority 1: Everyone asleep or gone -> OFF
      - action: off
        variable: isAnyoneHomeAndAwake
        value: false
      # Priority 2-4: Any presence indicator -> ON
      - action: on
        variable: isHaveGuests
        value: true
      - action: on
        variable: didOwnerJustReturnHome
        value: true
      # Priority 5-7: No presence indicators -> OFF
      - action: off
        variable: isHaveGuests
        value: false
      - action: off
        variable: didOwnerJustReturnHome
        value: false
      - action: off
        variable: isFrontOfHousePersonPresent
        value: false
    increase_brightness_if_true: ~
    transition_seconds: ~

  - hue_group: N Office
    hass_area_id: n_office
    conditions:
      # Priority 1: Office not occupied -> OFF
      - action: off
        variable: isNickOfficeOccupied
        value: false
      # Priority 2: Office occupied -> ON
      - action: on
        variable: isNickOfficeOccupied
        value: true
    increase_brightness_if_true: ~
    transition_seconds: 2

  - hue_group: Kitchen
    hass_area_id: kitchen
    conditions:
      # Priority 1: No one home and awake -> OFF
      - action: off
        variable: isAnyoneHomeAndAwake
        value: false
      # Priority 2: Kitchen occupied -> ON
      - action: on
        variable: isKitchenOccupied
        value: true
    increase_brightness_if_true: ~
    transition_seconds: 5

  - hue_group: C Office
    hass_area_id: c_office
    conditions:
      # Priority 1: No one home and awake -> OFF
      - action: off
        variable: isAnyoneHomeAndAwake
        value: false
    increase_brightness_if_true: ~
    transition_seconds: 2
