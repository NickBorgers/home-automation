---
color_tracking:
  # Follow the lux-controlled Living cans into the aggregate Back Hall group. Only color is copied:
  # power and brightness remain under their existing controls.
  source_entity: light.living_cans
  target_entity: light.back_hall

lux_curve:
  points:
    - anchor: sun.dawn
      lux: 300
      kelvin: 4000
    - anchor: sun.noon
      lux: 300
      kelvin: 4000
    - anchor: sun.goldenHour
      lux: 150
      kelvin: 3000
    - anchor: schedule.dusk
      lux: 100
      kelvin: 3000
    - anchor: schedule.winddown
      lux: 30
      kelvin: 3000
    - anchor: schedule.night
      lux: 5
      kelvin: 3000
  outdoor_sensor: sensor.weather_station_illuminance
  smoothing_minutes: 5
  tick_seconds: 60
  dark_below_lux: 30
  light_above_lux: 80

rooms:
  - hue_group: Living
    hass_area_id: living
    conditions:
      # Priority 0: TV playing -> skip (Hue Sync controls the lights)
      # When Hue Sync is active, don't override with scene activation
      - action: skip
        variable: isTVPlaying
        value: true
      # Priority 1: No one home -> OFF
      - action: off
        variable: isAnyoneHomeAndAwake
        value: false
      # Priority 2: Someone home and awake -> ON
      - action: on
        variable: isAnyoneHomeAndAwake
        value: true
      # Priority 3: TV not playing -> ON (for ambient lighting)
      - action: on
        variable: isTVPlaying
        value: false
    increase_brightness_if_true: isHaveGuests
    transition_seconds: 30
    # Lux-target control for the ceiling cans. See docs/flows/LUX_LIGHTING.md.
    # active: the plugin drives the cans (light.living_cans) from the lux curve. The accent
    # lights stay on per-phase scenes: scene.main_living_accent_<phase>. Until those six
    # scenes exist in Hue, the scene call fails and logs an error, and the accents stay as they are.
    # log_only (for testing): scenes drive the whole room; shadow state shows what lux control would do.
    #
    # MEASURED with a handheld lux meter, 2026-10-31/11-01; the meter reads about 81% of
    # sensor.weather_station_illuminance outdoors, which cancels out in daylight_factor.
    # Calibration: lux at the spot, only the cans on, in the dark (ambient 0-2 lux), 4000 K.
    # See docs/flows/LUX_LIGHTING.md ("Calibration"). lux_scale is still a GUESS.
    lux_control:
      mode: active
      cans: light.living_cans
      accent_scene_group: Main Living Accent
      # MEASURED 2026-10-31 13:10-13:30: 39.45 lux indoors (cans off) / station 24,000-39,000 lux.
      # One sky condition only (sun and thin cloud), so treat it as a single sample.
      daylight_factor: 0.0011
      lux_scale: 0.5          # GUESS. The cans reach about 119 lux, below the 300 lux curve
      calibrated: true
      calibration:            # MEASURED, handheld lux meter, 4000 K, in the dark
        - brightness_pct: 5
          lux: 0.7
        - brightness_pct: 10
          lux: 1.65
        - brightness_pct: 15
          lux: 3.0
        - brightness_pct: 25
          lux: 7.9
        - brightness_pct: 50
          lux: 30.1
        - brightness_pct: 100
          lux: 119.0

  - hue_group: Primary Suite
    hass_area_id: primary_bed
    turn_off_entity_id: light.primary_suite
    # The "day"/"evening"/etc Hue scenes for this room have `auto_dynamic: true`
    # (animated palette). The bridge's autonomous palette has been observed to
    # fail to start when bulbs are mid-transition or cold, leaving bulbs off.
    # `has_dynamics: true` opts this room into hue.activate_scene two-step
    # recall (static first, then dynamic) so the palette starts from a stable
    # known state.
    has_dynamics: true
    conditions:
      # CRITICAL: isWakeSequenceActive and isMasterAsleep MUST be checked
      # BEFORE isAnyoneHomeAndAwake!
      #
      # BUG FIX (2026-02-24 production incident):
      # During wake sequence, sleephygiene controls the bedroom lights with
      # a slow fade-in. The lighting plugin must completely hands-off during
      # wake sequence to avoid interfering with the fade-in.
      #
      # Similarly, when master is asleep (but not wake sequence), the lighting
      # plugin should not control the bedroom lights. Sleephygiene manages
      # sleep state lighting.
      #
      # Priority 1: Wake sequence in progress -> yield to sleephygiene
      # This takes absolute priority to prevent interference with wake sequence
      - action: skip
        variable: isWakeSequenceActive
        value: true
      # Priority 2: Sleep prep active -> yield (bedtime initiated, waiting for sleep detection)
      - action: skip
        variable: isSleepPrepActive
        value: true
      # Priority 3: Master asleep -> yield to sleephygiene
      # Bedroom is in sleep mode, don't interfere
      - action: skip
        variable: isMasterAsleep
        value: true
      # Priority 4: No one home and awake -> OFF
      - action: off
        variable: isAnyoneHomeAndAwake
        value: false
      # Priority 5: Master not asleep -> ON
      - action: on
        variable: isMasterAsleep
        value: false
    increase_brightness_if_true: ~
    transition_seconds: 180

  - hue_group: Sitting
    hass_area_id: sitting
    conditions:
      # Priority 1: No one home -> OFF
      - action: off
        variable: isAnyoneHomeAndAwake
        value: false
      # Priority 2: Someone home and awake -> ON
      - action: on
        variable: isAnyoneHomeAndAwake
        value: true
    increase_brightness_if_true: ~
    transition_seconds: 120

  - hue_group: Front of House
    hass_area_id: front_of_house
    conditions:
      # Priority 0: Daylight -> OFF. Exterior lights only run when dark.
      # Without this, an owner arrival or guests turn them on in daylight.
      - action: off
        variable: isDarkOutside
        value: false
      # Priority 1: Front of house person present -> ON
      - action: on
        variable: isFrontOfHousePersonPresent
        value: true
      # Priority 2: Owner just returned -> ON (avoids race)
      - action: on
        variable: didOwnerJustReturnHome
        value: true
      # Priority 3: Guests present -> ON
      - action: on
        variable: isHaveGuests
        value: true
      # Priority 4: Everyone asleep or gone -> OFF
      - action: off
        variable: isAnyoneHomeAndAwake
        value: false
      # Priority 5-7: No presence indicators -> OFF
      - action: off
        variable: isHaveGuests
        value: false
      - action: off
        variable: didOwnerJustReturnHome
        value: false
      - action: off
        variable: isFrontOfHousePersonPresent
        value: false
    increase_brightness_if_true: ~
    transition_seconds: 15

  - hue_group: Decorative Outdoor Lights
    hass_area_id: front_of_house
    conditions:
      # Priority 0: Daylight -> OFF. Exterior lights only run when dark.
      # Without this, an owner arrival or guests turn them on in daylight.
      - action: off
        variable: isDarkOutside
        value: false
      # Priority 1: Front of house person present -> ON
      - action: on
        variable: isFrontOfHousePersonPresent
        value: true
      # Priority 2: Owner just returned -> ON (avoids race)
      - action: on
        variable: didOwnerJustReturnHome
        value: true
      # Priority 3: Guests present -> ON
      - action: on
        variable: isHaveGuests
        value: true
      # Priority 4: Everyone asleep or gone -> OFF
      - action: off
        variable: isAnyoneHomeAndAwake
        value: false
      # Priority 5-7: No presence indicators -> OFF
      - action: off
        variable: isHaveGuests
        value: false
      - action: off
        variable: didOwnerJustReturnHome
        value: false
      - action: off
        variable: isFrontOfHousePersonPresent
        value: false
    increase_brightness_if_true: ~
    transition_seconds: ~

  - hue_group: Kitchen
    hass_area_id: kitchen
    conditions:
      # Priority 1: No one home and awake -> OFF
      - action: off
        variable: isAnyoneHomeAndAwake
        value: false
      # Priority 2: Kitchen occupied -> ON
      - action: on
        variable: isKitchenOccupied
        value: true
    increase_brightness_if_true: ~
    transition_seconds: 5
    # The kitchen mmWave radar (Apollo MTR) is unreliable for stationary people:
    # it briefly drops detection then re-detects. Without this flag, every
    # re-detection re-activates the scene and overrides any manual brightness
    # the user dialed in. Edge-trigger so on→on reactivations are skipped.
    skip_reactivation_when_on: true
    # The under-cabinet strip (light.kitchen_main_lights) is no longer recalled by scene. It follows
    # the cans through lux_control.follower_lights below. The six scene.kitchen_under_cabinet_*
    # scenes stay in Home Assistant, unused.
    # Lux-target control for the 7 ceiling cans. See docs/flows/LUX_LIGHTING.md.
    # There is no accent_scene_group: the Kitchen Hue room holds only the cans.
    #
    # MEASURED with a handheld lux meter, 2026-10-31/11-01; the meter reads about 81% of
    # sensor.weather_station_illuminance outdoors, which cancels out in daylight_factor.
    # The Kitchen is two lighting domains. The island (cans) is calibrated here. The workspace
    # under the cabinet (strip) is kept bright on purpose. See docs/flows/LUX_LIGHTING.md.
    # Calibration: lux at the island, only the cans on, in the dark, 4000 K.
    lux_control:
      mode: active
      cans: light.kitchen_cans
      # MEASURED 2026-10-31 13:10-13:30 at the island: 39.35 lux (cans off) / station 24,000-39,000 lux.
      # The workspace by the strip gave 0.0010. One sky condition only (sun and thin cloud).
      daylight_factor: 0.0012
      lux_scale: 0.5          # GUESS, same as Living. The cans reach about 237 lux
      # Task lighting: the strip is brighter than the cans, fairly flat.
      # strip % = clamp(floor_pct + gain * cans %, 1, 100), brightness only, off when the cans are off.
      # floor_pct 20 and gain 0.8 are USER-CHOSEN STARTING GUESSES (cans 100% -> 100%, 50% -> 60%,
      # 10% -> 28%). Tune later.
      # WARNING: this strip is dim-to-warm. Its color temperature follows its brightness (warmer as it
      # dims). cct_curve (below) lets the plugin keep the strip at least as bright as the cans'
      # color temperature needs, so a cool target cannot leave the strip too warm.
      follower_lights:
        - entity: light.kitchen_main_lights # Kitchen Under Cabinet
          floor_pct: 20
          gain: 0.8
          # MEASURED BY EYE 2026-11-08 (issue #1263): the cans were set to each Kelvin at 50%, and the
          # Lutron dimmer was set until the strip looked the same. Strip brightness read back from
          # Home Assistant. One run, no repeat, no hysteresis check, no instrument. About +-5% error.
          # 4000 K was reached at 100%, the strip's limit, so a true 4000 K may need more. Below
          # 3000 K is not measured: the plugin sets no floor there.
          # Brightness in Home Assistant counts: 124, 193, 226, 242, 255 of 255.
          cct_curve:
            - {brightness_pct: 49, kelvin: 3000}
            - {brightness_pct: 76, kelvin: 3250}
            - {brightness_pct: 89, kelvin: 3500}
            - {brightness_pct: 95, kelvin: 3750}
            - {brightness_pct: 100, kelvin: 4000}
      calibrated: true
      calibration:            # MEASURED at the island, handheld lux meter, 4000 K, in the dark
        - brightness_pct: 5
          lux: 1.3
        - brightness_pct: 10
          lux: 3.1
        - brightness_pct: 15
          lux: 5.9
        - brightness_pct: 25
          lux: 15.8
        - brightness_pct: 50
          lux: 61.1
        - brightness_pct: 100
          lux: 237

  # The Pantry has no Hue scene group and no occupancy sensor. Its cans follow the Kitchen's
  # conditions. There is no hass_area_id: turn-off targets the cans entity directly, so it does
  # not depend on which Home Assistant area the pantry cans sit in.
  - hue_group: Pantry
    conditions:
      # Same as the Kitchen
      - action: off
        variable: isAnyoneHomeAndAwake
        value: false
      - action: on
        variable: isKitchenOccupied
        value: true
    increase_brightness_if_true: ~
    transition_seconds: 5
    # Cans calibration MEASURED 2026-11-02 evening with a handheld lux meter: dark, ambient 0 lux,
    # only the cans on, 4000 K. The Mud cans were in the same group (light.pantry_cans) at
    # the time, but a wall separates the rooms, so the table is unaffected. The Mud cans are
    # their own room below.
    lux_control:
      mode: active
      cans: light.pantry # 6 cans (the 2 Mud cans are the Mud room)
      # MEASURED 2026-11-05 in daylight with the handheld lux meter: 50.0 lux indoors (average of
      # 50.4 and 49.6), cans off / station 61,311 lux.
      daylight_factor: 0.00082
      lux_scale: 0.5          # GUESS, same as Living
      # Under-cabinet task strip, same shape as the Kitchen's. No scenes exist for it.
      # The strip was not measured. The user said it is roughly as bright as the Kitchen strip, so it
      # copies the Kitchen mapping: floor_pct 20 and gain 0.8 (cans 100% -> 100%, 50% -> 60%,
      # 10% -> 28%). These are USER-CHOSEN STARTING GUESSES. Tune later.
      # The Pantry strip is a plain fixed 3000 K strip (no dim-to-warm), so the Kitchen's warmth
      # warning does not apply here. The mapping is copied by user choice.
      follower_lights:
        - entity: light.pantry_under_cabinet
          floor_pct: 20
          gain: 0.8
      calibrated: true
      calibration:            # MEASURED 2026-11-02, handheld lux meter, 4000 K, in the dark, cans only
        - brightness_pct: 5
          lux: 1
        - brightness_pct: 10
          lux: 3
        - brightness_pct: 15
          lux: 6
        - brightness_pct: 25
          lux: 16
        - brightness_pct: 50
          lux: 64
        - brightness_pct: 100
          lux: 263

  # The Mud room was split out of the Pantry on 2026-11-05: light.mud is its 2 cans
  # (light.mud_door_can + light.mud_cabinet_can). Like the Pantry it has no Hue scene group
  # and no hass_area_id, so turn-off targets the cans entity directly. Same conditions as the Pantry
  # (which follow the Kitchen), no strip or followers.
  - hue_group: Mud
    conditions:
      - action: off
        variable: isAnyoneHomeAndAwake
        value: false
      - action: on
        variable: isKitchenOccupied
        value: true
    increase_brightness_if_true: ~
    transition_seconds: 5
    lux_control:
      mode: active
      cans: light.mud # 2 cans
      # MEASURED 2026-11-05 in daylight: ambient 8.3 lux, cans off / station 61,615 lux.
      # A SINGLE reading, so treat it as rough.
      daylight_factor: 0.00013
      lux_scale: 0.5 # GUESS, same as the Pantry
      calibrated: true
      # MEASURED 2026-11-05 in DAYLIGHT (not in the dark), 4000 K, brightness only, by subtracting the
      # 8.3 lux ambient from each reading. Low steps are therefore noisy (meter resolution 0.1 lux).
      # A re-check in the dark is welcome.
      calibration:
        - brightness_pct: 5
          lux: 0.8
        - brightness_pct: 10
          lux: 1.8
        - brightness_pct: 15
          lux: 3.1
        - brightness_pct: 25
          lux: 8.5
        - brightness_pct: 50
          lux: 33.7
        - brightness_pct: 100
          lux: 131.4

  # The Entryway and Sitting chandeliers are Lutron Diva dimmers: brightness only, no color
  # temperature (color_temp: false), so the plugin sends brightness_pct and transition and never
  # kelvin. Like the Pantry they have no Hue scene group. The Sitting Chandelier has no
  # hass_area_id, so turn-off targets the light entity directly. The Entryway uses its Home
  # Assistant area, so turn-off also covers the Entryway wall light. They are on whenever someone
  # is home and awake, with no occupancy sensor.
  #
  # MEASURED with a handheld lux meter, 2026-10-31/11-01; the meter reads about 81% of
  # sensor.weather_station_illuminance outdoors, which cancels out in daylight_factor.
  # Calibration: lux at the spot, only that chandelier on, in the dark (ambient 0-2 lux).
  # Below the first point (5%) brightness is interpolated from 0% = 0 lux, so a small target
  # still gives a small brightness (sent as at least 1%). No 1% point is added: the lowest need
  # is 1 lux (night target 5 x 0.2), inside the table, and a linear extrapolation to 1% would be
  # negative for the Sitting Chandelier.
  - hue_group: Entryway
    hass_area_id: entryway
    conditions:
      - action: off
        variable: isAnyoneHomeAndAwake
        value: false
      - action: on
        variable: isAnyoneHomeAndAwake
        value: true
    increase_brightness_if_true: ~
    transition_seconds: 5
    lux_control:
      mode: active
      cans: light.entryway_chandelier
      color_temp: false
      # MEASURED 2026-10-31 13:10-13:30: 212 lux indoors (chandelier off) / station 24,000-39,000 lux.
      # One sky condition only (sun and thin cloud).
      daylight_factor: 0.0061
      lux_scale: 0.2 # GUESS, lower than the cans rooms (0.5); tune later
      calibrated: true
      calibration: # MEASURED, handheld lux meter, brightness only, in the dark
        - brightness_pct: 5
          lux: 2
        - brightness_pct: 10
          lux: 4.4
        - brightness_pct: 25
          lux: 12.9
        - brightness_pct: 50
          lux: 48
        - brightness_pct: 100
          lux: 111

  - hue_group: Sitting Chandelier
    conditions:
      - action: off
        variable: isAnyoneHomeAndAwake
        value: false
      - action: on
        variable: isAnyoneHomeAndAwake
        value: true
    increase_brightness_if_true: ~
    transition_seconds: 5
    lux_control:
      mode: active
      cans: light.sitting_chandelier
      color_temp: false
      # MEASURED 2026-10-31 13:10-13:30: 874.5 lux at the DAYTIME spot (chandelier off) / station
      # 24,000-39,000 lux. The calibration below was taken at the NIGHT-USE spot, which was not
      # measured in daylight, so 0.027 is an UPPER BOUND for it. A window farther south in the room
      # gave 0.019. One sky condition only (sun and thin cloud).
      daylight_factor: 0.027
      lux_scale: 0.2 # GUESS, lower than the cans rooms (0.5); tune later
      calibrated: true
      calibration: # MEASURED at the night-use spot (not the daytime spot), handheld lux meter, in the dark
        - brightness_pct: 5
          lux: 0.8
        - brightness_pct: 10
          lux: 3.9
        - brightness_pct: 25
          lux: 23
        - brightness_pct: 50
          lux: 99
        - brightness_pct: 100
          lux: 155

  - hue_group: Office
    hass_area_id: office
    conditions:
      # Priority 1: No one home and awake -> OFF
      - action: off
        variable: isAnyoneHomeAndAwake
        value: false
    increase_brightness_if_true: ~
    transition_seconds: 2

  # Off-only rooms. These lights have no lighting room of their own, so the plugin only turns
  # them off when no one is home and awake. They used to be turned off with Living
  # (Back Hall, Kids Bathroom) or the Kitchen (Breakfast Nook), when Home Assistant had them in
  # those areas.
  - hue_group: Back Hall
    hass_area_id: back_hall
    conditions:
      - action: off
        variable: isAnyoneHomeAndAwake
        value: false
    increase_brightness_if_true: ~
    transition_seconds: ~

  - hue_group: Kids Bathroom
    hass_area_id: kids_bathroom
    conditions:
      - action: off
        variable: isAnyoneHomeAndAwake
        value: false
    increase_brightness_if_true: ~
    transition_seconds: ~

  - hue_group: Breakfast Nook
    hass_area_id: breakfast_nook
    conditions:
      - action: off
        variable: isAnyoneHomeAndAwake
        value: false
    increase_brightness_if_true: ~
    transition_seconds: ~
