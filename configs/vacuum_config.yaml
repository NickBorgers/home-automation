# Casper vacuum plugin configuration.
#
# The vacuum: section drives the error announcer. The scheduler: section drives
# the dirty-room scheduler. See docs/flows/VACUUM.md.
vacuum:
  # Home Assistant sensor exposing the vacuum's current error state. The state
  # equals no_error_value when the vacuum is healthy; any other value is treated
  # as an active error description after transient unavailable/unknown states
  # have cleared the plugin's debounce window.
  error_sensor_id: "sensor.valetudo_mellowslimyloris_error"
  no_error_value: "No error"

  announcement:
    # Re-announce an unresolved error this often, in Go duration syntax.
    # Vacuum errors use UrgencyDeferable: the shared notifier suppresses
    # delivery while input_boolean.master_asleep is on, but this repeat timer
    # keeps ticking so the next attempt after wake makes it through.
    repeat_interval: "2h"

    # Sentence prefix; the error description is appended after a colon.
    message_prefix: "Casper needs attention"

    # Speakers to announce on.
    speakers:
      - "media_player.lounge"
      - "media_player.sitting"
      - "media_player.primary_bed"
      - "media_player.kids_bathroom"

  clear_announcement:
    # Feel-good recovery confirmation after a real error returns to no_error_value.
    # Uses UrgencyDeferable, so it is skipped while master is asleep.
    message: "You have satisfied Casper"
    speakers:
      - "media_player.sitting"

  # Reserved for future use:
  # entity_id: "vacuum.valetudo_mellowslimyloris"

  # Dirty-room scheduler. This is an example for a made-up house. A deployment
  # writes its own rooms, segment ids and intervals. Room names are house-map
  # room names (configs/house_map.yaml). Each room needs these Home Assistant
  # helpers, or it is skipped with a warning:
  #   input_boolean.vacuum_dirty_<room>      full-clean taint; turn on by hand to ask for a clean
  #   input_datetime.vacuum_cleaned_<room>   last full clean (date and time)
  #   input_number.vacuum_cost_<room>        learned battery % for a full clean
  # A room with a vacuum interval also needs the same three with a _vacuum
  # suffix. input_number.vacuum_cost_trip holds the learned trip cost.
  scheduler:
    # off: do nothing. log_only: track runs, learn costs and keep the taint
    # helpers up to date, but send no robot commands. active: also start runs.
    mode: "off"

    # The robot's Valetudo base URL.
    valetudo_url: "http://valetudo.example"

    # The room the dock stands in. Leave empty to use valetudo.dock_m of the
    # house map.
    dock_room: ""

    # Plan every replan_interval and on any input change. The same plan must
    # hold for stable_for before a run starts. track_interval is how often the
    # robot is polled. min_dwell is how long the robot must stay in a room it
    # was not expected in before that room counts as being cleaned.
    replan_interval: "5m"
    stable_for: "10m"
    track_interval: "30s"
    min_dwell: "2m"

    battery:
      # Start only at or above start_min. Plan so the run ends at or above
      # floor.
      start_min: 70
      floor: 30
      # Weight of a new battery sample in the learned cost.
      learning_rate: 0.3
      # First guess before any sample: floor area in m² times this, per
      # treatment.
      default_cost_per_m2:
        full: 0.6
        vacuum: 0.4
      default_trip_cost: 5

    # Valetudo presets each treatment sets before a run. An empty preset is
    # left as it is.
    treatments:
      full:
        operation_mode: "vacuum_and_mop"
        fan_speed: "medium"
        water_grade: "medium"
      vacuum:
        operation_mode: "vacuum"
        fan_speed: "medium"

    # A sleeper's rooms and their door neighbours are not cleaned while the
    # state variable is on. require is an optional second state variable that
    # must also be on.
    sleepers:
      - state: "isMasterAsleep"
        rooms: ["bedroom"]
      - state: "isGuestAsleep"
        require: "isHaveGuests"
        rooms: ["guest_room"]

    # Rooms to clean. full is how long after a full clean (vacuum and mop) the
    # room is dirty again. vacuum adds a vacuum-only taint with its own
    # interval. Use Go durations: 168h is a week. Rooms not listed are only
    # driven through.
    rooms:
      kitchen: {segment_id: "1", full: "48h", vacuum: "12h"}
      lounge: {segment_id: "2", full: "84h"}
      hall: {segment_id: "3", full: "72h"}
      bedroom: {segment_id: "4", full: "48h"}
      guest_room: {segment_id: "5", full: "168h"}
