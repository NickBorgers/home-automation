---
# Lutron Pico buttons that step the brightness of light groups.
#
# A Pico controls nothing inside Lutron. Home Assistant reports each press as a
# lutron_caseta_button_event, and the picos plugin answers it.
#
# Up press:   lights off -> on_pct. Lights on -> +step_pct, up to 100%.
# Down press: lights at or below off_at_or_below_pct -> off. Otherwise -step_pct.
#
# The first light of a target is the reference. Its brightness decides the next level.
# Every other light of the target is set to that level.
#
# wakes_house (on a target): an up press that turns the target on from off while
# someone is asleep sets isEarlyWakeActive. The common areas wake up; the bedroom
# keeps sleeping (see early_wake_config.yaml). Only main-living-space targets get
# it. The pantry and the back hall are night paths and must never wake the house.
#
# path_lights (on a button): an up press while the house is asleep
# (isAnyoneHomeAndAwake false) also turns on these lights at brightness_pct and
# kelvin, but only the ones that are off. A down press that turns the target off
# turns off the path lights this plugin turned on; off_after does it if nobody
# presses. Lights that were already on are never touched. Path lights never wake
# the house.
#
# To add a Pico, press it and read /api/shadow/picos. lastEvent shows its deviceId, and
# matched is false until the device is listed here. The device ID is also in
# Home Assistant: Settings -> Devices -> the Pico -> the last part of the URL.

on_pct: 30
step_pct: 15
off_at_or_below_pct: 30
transition_seconds: 0.5
recent_seconds: 5

targets:
  # Pantry Area is the Hue zone of the pantry cans plus the hall by the primary suite.
  - name: pantry
    lights:
      - light.pantry_area
      - light.pantry_under_cabinet

  - name: kitchen
    wakes_house: true
    lights:
      - light.kitchen_cans
      - light.kitchen_main_lights  # Kitchen Under Cabinet (Lutron)

  # The Back Hall down light. The up light is left out until the accent group exists.
  - name: back hall
    lights:
      - light.back_hall_bottom

  - name: living
    wakes_house: true
    lights:
      - light.living_cans

buttons:
  # By the primary suite door. Lights the way for someone walking into the pantry.
  - name: Pantry Primary Suite Door
    device_id: 53029c3f27ec026f77bdaa7057187bbe
    target: pantry

  # Inside the pantry. Same effect as the Pico by the primary suite door.
  - name: Pantry Pantry Lights
    device_id: 7565da047cf5f8cd4a788e13b640cd6d
    target: pantry

  # Inside the pantry, marked for the kitchen. Lights the next space for someone walking through.
  - name: Pantry Kitchen Lights
    device_id: cc81d6bde6cb377b0be9f9108735779d
    target: kitchen

  # Back Hall, between the bedrooms. A 2-button Pico, formerly "Living Room Remote on Kitchen Wall".
  # It is the guest's Pico by their door: it lights the walk to the bathroom and the
  # living room without waking the house.
  - name: Hallway Between Bedrooms
    device_id: 80f92d7f29fdbef7643ed1b002532267
    target: back hall
    path_lights:
      # The two north living cans. Hue names both "Living Can NE"; one is really NW.
      lights:
        - light.hue_color_downlight_1
        - light.hue_color_downlight_3
      brightness_pct: 5
      kelvin: 2200
      off_after: 15m

  # Back Hall, by Living. Same effect as the Pico between the bedrooms.
  - name: Hallway Hall Light Switch by Living
    device_id: 94ac4ddc87211f92e2ea35444a567bc5
    target: back hall

  # Back Hall, for Living. Steps the living cans Hue group like the pantry Picos do.
  - name: Hallway Living Switch
    device_id: b24af62680f649083e66166fc40faf76
    target: living
