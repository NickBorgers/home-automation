          - variable: isTVPlaying
            value: true
      - player_name: "Kids Bathroom"
        base_volume: 7
        leave_muted_if:
          - variable: isTVPlaying
            value: true
      - player_name: "Bedroom"
        base_volume: 9
        # Exclude during wake sequence (bedroom stays on sleep zone)
        exclude_if:
          - variable: isMasterAsleep
            value: true
      - player_name: "Sitting Room"
        base_volume: 8
        leave_muted_if:
          - variable: isTVPlaying
            value: true
      - player_name: "Primary Bathroom"
        base_volume: 9
