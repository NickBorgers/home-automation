---
# Phase 2: Zone definitions for multi-zone music playback
# Zones are evaluated in priority order.
# Higher priority zones claim speakers first.
# Triggers use AND logic - all conditions must match for zone activation.
zones:
  # sleep-prep: Whole-house sleep sounds BEFORE master goes to bed
  # Helps direct people to bed during night phase
  - name: "sleep-prep"
    priority: 90  # Below sleep but above other zones
    trigger:
      - variable: dayPhase
        value: night
      - variable: isAnyoneHome
        value: true
      - variable: isMasterAsleep
        value: false

  # sleep: Bedroom-only sleep sounds AFTER master goes to bed
  # Doesn't restart during wake sequence (sleephygiene manages bedroom fade-out)
  - name: "sleep"
    priority: 100  # Highest auto-trigger - sleep takes precedence
    trigger:
      - variable: isMasterAsleep
        value: true
      - variable: isAnyoneHome
        value: true
      - variable: isWakeSequenceActive
        value: false
  - name: "morning"
    priority: 50
    # OR logic: either normal morning conditions OR wake sequence active
    trigger_groups:
      - triggers:  # Normal: morning phase, no one asleep
          - variable: dayPhase
            value: morning
          - variable: isAnyoneHome
            value: true
          - variable: isAnyoneAsleep
            value: false
      - triggers:  # Wakeup: wake sequence active during morning
          - variable: isWakeSequenceActive
            value: true
          - variable: dayPhase
            value: morning
          - variable: isAnyoneHome
            value: true
  - name: "day"
    priority: 40
    trigger:
      - variable: dayPhase
        value: day
      - variable: isAnyoneHome
        value: true
      - variable: isAnyoneAsleep
        value: false
  - name: "evening"
    priority: 40
    trigger_groups:
      - triggers:
          - variable: dayPhase
            value: sunset
          - variable: isAnyoneHome
            value: true
          - variable: isAnyoneAsleep
            value: false
      - triggers:
          - variable: dayPhase
            value: dusk
          - variable: isAnyoneHome
            value: true
          - variable: isAnyoneAsleep
            value: false
  - name: "winddown"
    priority: 40
    trigger_groups:
      - triggers:
          - variable: dayPhase
            value: winddown
          - variable: isAnyoneHome
            value: true
          - variable: isAnyoneAsleep
            value: false
      - triggers:
          - variable: dayPhase
            value: night
          - variable: isAnyoneHome
            value: true
          - variable: isAnyoneAsleep
            value: false
  # sex and wakeup zones are manually triggered via musicPlaybackType
  # They don't have automatic triggers
  - name: "sex"
    priority: 150  # Highest - override mode, always takes precedence
    trigger: []
  - name: "wakeup"
    priority: 110  # Higher than sleep - used to wake someone up
    trigger: []

music:
  morning:
    participants:
      - player_name: "Front Room"
        base_volume: 8
        leave_muted_if: []
      - player_name: "Kitchen"
        base_volume: 9
