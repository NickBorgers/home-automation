---
energy:
  free_energy_time:
    start: "21:00"
    end: "07:00"
  indicator_lights:
    friendly_name_pattern: "Radar"  # Matches Apollo MTR sensors
    adaptive_brightness:
      enabled: true
      lux_sensor_pattern: "ltr390_light"  # Matches Apollo MSR-2 light sensors
      debounce_duration_sec: 5
      hysteresis_percent: 10
      brightness_curve:
        - lux_max: 10
          brightness_pct: 20
        - lux_max: 100
          brightness_pct: 40
        - lux_max: 500
          brightness_pct: 60
        - lux_max: 1000
          brightness_pct: 80
  energy_states:
    -  condition_name: black
       battery_minimum_percentage: 0
       energy_production_minimum_kw: 0
       remaining_energy_production_minimum_kwh: 0
       light_config:
         red: 25
         green: 25
         blue: 112
         brightness_pct: 70
    -  condition_name: red
       battery_minimum_percentage: 40
       energy_production_minimum_kw: 0
       remaining_energy_production_minimum_kwh: 0
       light_config:
         red: 255
         green: 0
         blue: 0
         brightness_pct: 30
    -  condition_name: yellow
       battery_minimum_percentage: 60
       energy_production_minimum_kw: 0
       remaining_energy_production_minimum_kwh: 0
       light_config:
         red: 255
         green: 255
         blue: 0
         brightness_pct: 30
    -  condition_name: green
       battery_minimum_percentage: 80
       energy_production_minimum_kw: 0
       remaining_energy_production_minimum_kwh: 10
       light_config:
         red: 0
         green: 255
         blue: 0
         brightness_pct: 60
    -  condition_name: white
       battery_minimum_percentage: 95
       energy_production_minimum_kw: 4
       remaining_energy_production_minimum_kwh: 20
       light_config:
         red: 255
         green: 255
         blue: 255
         brightness_pct: 100

